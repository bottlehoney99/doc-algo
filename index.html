  .hp-key{appearance:none;font-family:"JetBrains Mono",monospace;font-weight:900;font-size:15px;min-width:46px;padding:7px 12px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--ink);cursor:grab;transition:.15s;}
  .hp-key:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .hp-key.selected{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  .hp-key.placed{opacity:.35;cursor:default;text-decoration:line-through;border-style:dashed;}
  .hp-key.target{cursor:default;}
  .hp-key.t-done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .hp-key.t-miss{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
  .hp-key.t-now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .hp-key.t-wait{opacity:.5;}
  .hp-calc{background:var(--surface-2);border-radius:11px;padding:9px 12px;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:800;color:var(--ink);line-height:1.6;min-height:56px;}
  .hp-calc .q{color:var(--accent);}
  .hp-calc .hint{display:block;margin-top:2px;color:var(--amber);font-weight:700;font-size:12.4px;}
  .hp-log{background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:9px 12px;font-size:12.8px;font-weight:700;line-height:1.55;min-height:96px;max-height:190px;flex:none;overflow-y:auto;}
  .hp-log.ok{background:var(--teal-soft);color:var(--teal);}
  .hp-log.bad{background:var(--danger-soft);color:var(--danger);}
  .hp-log .hp-sub{display:block;margin-top:3px;font-weight:600;color:var(--ink-soft);}
  .hp-btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  .hp-btnrow .sim-btn{flex:1;min-width:110px;}
  .hp-table{display:flex;flex-direction:column;gap:5px;min-height:0;overflow-y:auto;}
  .hp-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:10px;border:1.5px solid var(--border-soft);background:var(--surface-2);cursor:pointer;transition:background .15s,border-color .15s;min-height:36px;}
  .hp-row:hover,.hp-row:focus-visible{border-color:var(--accent);outline:none;}
  .hp-row.over{background:var(--accent-soft);border-color:var(--accent);}
  .hp-row.wrong{border-color:var(--danger);background:var(--danger-soft);animation:hpShake .35s;}
  .hp-row.right{border-color:var(--teal);background:var(--teal-soft);}
  .hp-row.locked{cursor:default;}
  @keyframes hpShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media (prefers-reduced-motion: reduce){.hp-row.wrong{animation:none;}}
  .hp-addr{width:62px;flex:none;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:12.4px;color:var(--ink-faint);text-align:right;}
  .hp-chain{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1;min-height:28px;}
  .hp-chain .hp-link{color:var(--ink-faint);font-size:12px;}
  .hp-node{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:3px 10px;color:var(--ink);transition:.2s;}
  .hp-node.new{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .hp-node.collide{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
  .hp-node.cmp{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08);}
  .hp-node.hit{background:var(--teal);border-color:var(--teal);color:#fff;transform:scale(1.1);}
  .hp-node.skip{opacity:.45;}
  .hp-cnt{flex:none;font-size:11px;font-weight:800;color:var(--ink-faint);min-width:28px;text-align:right;}
  @media (max-width:760px){.hp-layout{grid-template-columns:1fr;}}

  /* ===== 참고 영상 카드 (YouTube 링크) ===== */
  .vid-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center;flex:1;min-height:0;}
  .vid-card{display:block;position:relative;aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,var(--code-bg),#16264a);color:#fff;text-decoration:none;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
  .vid-card:hover .vid-play,.vid-card:focus-visible .vid-play{transform:scale(1.08);}
  .vid-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  .vid-grid{position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.09) 1px,transparent 1px) 0 0/22px 22px;}
  .vid-play{position:absolute;left:50%;top:50%;width:84px;height:60px;margin:-30px 0 0 -42px;border-radius:16px;background:#e53935;display:flex;align-items:center;justify-content:center;transition:transform .18s;box-shadow:0 10px 28px -8px rgba(0,0,0,.6);}
  .vid-play svg{width:26px;height:26px;fill:#fff;margin-left:3px;}
  .vid-dur{position:absolute;right:12px;bottom:12px;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;background:rgba(0,0,0,.72);padding:3px 8px;border-radius:6px;}
  .vid-badge{position:absolute;left:14px;top:12px;font-size:11px;font-weight:800;letter-spacing:.06em;color:#cfe0ff;}
  .vid-info{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .vid-title{font-size:17px;font-weight:900;line-height:1.4;color:var(--ink);}
  .vid-meta{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .vid-meta b{color:var(--ink);}
  .vid-open{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:10px 16px;border-radius:10px;text-decoration:none;}
  .vid-open:hover{filter:brightness(1.08);}
  .vid-open:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;}
  @media (max-width:760px){.vid-layout{grid-template-columns:1fr;flex:none;min-height:auto;}}

  /* ===== 시간 복잡도 예시 코드 (기본 작업 · 반복/재귀 · 입력 특성) ===== */
  .ex-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .ex-tab{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);font-weight:800;font-size:12.6px;padding:8px 15px;border-radius:9px;cursor:pointer;}
  .ex-tab:hover{border-color:var(--accent);color:var(--accent);}
  .ex-tab.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .ex-panel{display:none;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:16px;flex:1;min-height:0;}
  .ex-panel.active{display:grid;}
  .ex-code{flex:1;font-size:14px;line-height:1.9;white-space:pre;}
  .ex-codewrap{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .ex-code .cline.skip{opacity:.38;}
  .ex-side{display:flex;flex-direction:column;gap:9px;min-width:0;}
  .ex-chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .ex-chiprow .lbl{font-size:11.5px;font-weight:800;color:var(--ink-faint);}
  .ex-chiprow .chip{font-size:12.4px;padding:6px 12px;}
  .ex-explain{font-size:14px;line-height:1.7;color:var(--ink-soft);}
  .ex-explain b{color:var(--ink);}
  .ex-result{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:11px 14px;font-weight:800;font-size:14.5px;line-height:1.6;}
  .ex-result .big{font-family:"Black Han Sans",sans-serif;font-size:26px;margin-right:6px;}
  .ex-cmp{font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:8px 12px;line-height:1.6;}
  .ex-cells{display:flex;gap:6px;flex-wrap:wrap;}
  .ex-cell{min-width:46px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:16px;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1.5px solid var(--border);color:var(--ink);}
  .ex-cell.cmp{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
  .ex-cell.hit{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  @media (max-width:760px){.ex-panel.active{grid-template-columns:1fr;}}

  /* ===== 시간 복잡도 그래프 ===== */
  .gc-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;flex:1;min-height:0;align-items:start;}
  .gc-chart{background:var(--surface-2);border-radius:14px;padding:8px;min-width:0;}
  .gc-chart svg{display:block;width:100%;height:auto;}
  .gc-grid{stroke:var(--border);stroke-width:1;}
  .gc-axis{stroke:var(--ink-faint);stroke-width:1.5;}
  .gc-tick{font-family:"JetBrains Mono",monospace;font-size:12px;fill:var(--ink-faint);}
  .gc-axname{font-size:11.5px;font-weight:800;fill:var(--ink-soft);}
  .gc-line{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;}
  .gc-c1{stroke:var(--teal);} .gc-c2{stroke:var(--violet);} .gc-c3{stroke:var(--accent);} .gc-c4{stroke:var(--amber);} .gc-c5{stroke:var(--danger);}
  .gc-dot.gc-c1{fill:var(--teal);} .gc-dot.gc-c2{fill:var(--violet);} .gc-dot.gc-c3{fill:var(--accent);} .gc-dot.gc-c4{fill:var(--amber);} .gc-dot.gc-c5{fill:var(--danger);}
  .gc-dot{stroke:var(--surface);stroke-width:2;}
  .gc-marker{stroke:var(--ink-faint);stroke-width:1.4;stroke-dasharray:4 4;}
  .gc-side{display:flex;flex-direction:column;gap:9px;min-width:0;}
  .gc-slider{display:flex;flex-direction:column;gap:4px;}
  .gc-slider label{font-size:13px;font-weight:800;color:var(--ink);}
  .gc-slider input[type=range]{width:100%;accent-color:var(--accent);}
  .gc-legend{display:flex;flex-direction:column;gap:5px;}
  .gc-row{display:flex;align-items:center;gap:9px;appearance:none;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .gc-row.off{opacity:.45;}
  .gc-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .gc-sw{width:22px;height:4px;border-radius:3px;flex:none;}
  .gc-name{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:12.6px;flex:1;}
  .gc-val{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:12.6px;font-variant-numeric:tabular-nums;color:var(--ink);}
  .gc-note{font-size:13.2px;font-weight:700;line-height:1.55;}
  .gc-foot{font-size:12px;color:var(--ink-faint);font-weight:600;}
  @media (max-width:760px){.gc-layout{grid-template-columns:1fr;}}

  /* ===== 버튼 없는 엘리베이터 : 애니메이션 ===== */
  .ev-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:6px;}
  .ev-building{position:relative;display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr)) 78px;gap:0;background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:14px;padding:38px 10px 8px;}
  .ev-col{position:relative;height:260px;}
  .ev-col.shaft{border-left:1.5px solid var(--border);background:repeating-linear-gradient(to top,transparent 0,transparent 25px,var(--border-soft) 25px,var(--border-soft) 26px);}
  .ev-col.shaft:nth-child(4){border-right:1.5px solid var(--border);}
  .ev-head{position:absolute;top:-36px;left:0;right:0;text-align:center;font-size:11.5px;font-weight:800;color:var(--ink-soft);line-height:1.2;}
  .ev-head b{display:block;font-family:"Black Han Sans",sans-serif;font-size:15px;color:var(--accent);font-weight:400;}
  .ev-flabel{position:absolute;left:0;right:6px;height:26px;display:flex;align-items:center;justify-content:flex-end;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:var(--ink-faint);}
  .ev-car{position:absolute;left:10px;right:10px;height:22px;margin-bottom:2px;border-radius:5px;background:var(--surface-3);border:1.5px solid var(--ink-faint);overflow:hidden;transition:bottom 1.1s cubic-bezier(.45,.05,.3,1),box-shadow .3s,opacity .3s,border-color .3s;z-index:2;}
  .ev-car .dl,.ev-car .dr{position:absolute;top:0;bottom:0;width:50%;background:var(--accent);transition:transform .5s;}
  .ev-car .dl{left:0;border-right:1px solid var(--accent-ink);} .ev-car .dr{right:0;}
  .ev-car.open .dl{transform:translateX(-82%);} .ev-car.open .dr{transform:translateX(82%);}
  .ev-car .in{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--amber);opacity:0;transition:opacity .3s;}
  .ev-car.occupied .in{opacity:1;}
  .ev-car.check{box-shadow:0 0 0 3px var(--amber);border-color:var(--amber);}
  .ev-car.dim{opacity:.4;}
  .ev-car.win{box-shadow:0 0 0 3px var(--teal);border-color:var(--teal);}
  .ev-car.win .dl,.ev-car.win .dr{background:var(--teal);}
  .ev-dist{position:absolute;left:50%;width:0;border-left:2px dashed var(--amber);opacity:0;transition:opacity .35s;z-index:1;}
  .ev-dist.on{opacity:1;}
  .ev-dist span{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:800;color:var(--amber);background:var(--surface-2);padding:1px 4px;border-radius:4px;white-space:nowrap;}
  .ev-tline{position:absolute;left:34px;right:0;height:0;border-top:2px dashed var(--accent);opacity:0;transition:opacity .35s;z-index:0;pointer-events:none;}
  .ev-tline.on{opacity:.8;}
  .ev-pax{position:absolute;left:8px;height:22px;margin-bottom:2px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ink);opacity:0;transition:opacity .35s;}
  .ev-pax i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--amber);}
  .ev-pax.on{opacity:1;}
  .ev-panel{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .ev-panel .elev-target-row{margin-top:0;justify-content:flex-start;}
  .ev-calc{display:flex;flex-direction:column;gap:6px;}
  .ev-row{display:grid;grid-template-columns:28px 64px minmax(0,1fr);gap:8px;align-items:center;background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--ink-soft);font-weight:700;transition:.25s;}
  .ev-row b{font-family:"Black Han Sans",sans-serif;font-size:17px;color:var(--accent);font-weight:400;}
  .ev-row .calc{font-family:"JetBrains Mono",monospace;font-size:12.6px;color:var(--ink-faint);}
  .ev-row.now{border-color:var(--amber);background:var(--amber-soft);} .ev-row.now .calc{color:var(--amber);}
  .ev-row.done .calc{color:var(--ink);}
  .ev-row.winner{border-color:var(--teal);background:var(--teal-soft);} .ev-row.winner .calc{color:var(--teal);}
  @media (prefers-reduced-motion: reduce){.ev-car,.ev-car .dl,.ev-car .dr,.ev-dist,.ev-tline,.ev-pax{transition:none;}}
  @media (max-width:760px){.ev-stage{grid-template-columns:1fr;}}

  /* ===== 나의 탐색 전략 선택하기 (개별 활동) ===== */
  .strategy-scenario{background:var(--surface-2);border-radius:13px;padding:16px 18px;font-size:14.4px;font-weight:700;color:var(--ink);text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;}
  .strategy-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .strategy-choice{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:14px;padding:14px;border-radius:11px;cursor:pointer;transition:.15s;}
  .strategy-choice:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .strategy-choice.correct{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .strategy-choice.wrong{background:color-mix(in srgb, var(--danger) 14%, transparent);border-color:var(--danger);color:var(--danger);}
  .strategy-choice:disabled{cursor:default;}
  .strategy-feedback{font-size:13px;color:var(--ink-faint);text-align:center;min-height:20px;font-weight:700;}
  .strategy-progress{text-align:center;font-size:12px;color:var(--ink-faint);font-weight:700;}


  /* ===== stepper 공용 (DFS/BFS, 다익스트라 스테퍼) ===== */
  .stepper-log{background:var(--surface-2);border-radius:11px;padding:11px 15px;font-size:13.2px;color:var(--ink);font-weight:700;min-height:20px;text-align:center;}
  .stepper-meta{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--ink-faint);font-weight:700;}
  .stepper-meta b{color:var(--accent);font-family:"JetBrains Mono",monospace;}

  /* ===== 공식 강조 박스 (다익스트라 갱신식 등) ===== */
  .hash-formula{text-align:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:15px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px;margin-bottom:2px;}

  /* ===== 쾨니히스베르크 다리 문제 (생각 열기) ===== */
  .bridge-map-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .bridge-chip-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px;}
  .bridge-chip{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:12.6px;padding:9px 13px;border-radius:10px;cursor:pointer;transition:.15s;font-family:"JetBrains Mono",monospace;}
  .bridge-chip:hover{border-color:var(--accent);}
  .bridge-chip.crossed{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .bridge-counter{font-size:12.5px;color:var(--ink-faint);font-weight:700;}
  .bridge-reveal{display:none;background:var(--surface-2);border-radius:13px;padding:14px 18px;font-size:13.4px;line-height:1.6;color:var(--ink);max-width:600px;}
  .bridge-reveal.show{display:block;}
  .bridge-degree-row{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
  .bridge-degree-chip{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:12.6px;padding:5px 11px;border-radius:999px;background:var(--danger-soft);color:var(--danger);}

  /* ===== 그래프 SVG 공통 (DFS/BFS, 다익스트라, 개별 활동 공용) ===== */
  .graph-svg-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  .graph-svg-wrap svg{width:100%;height:100%;max-height:230px;}
  .graph-edge{stroke:var(--border);stroke-width:2.4;}
  .graph-edge.traversed{stroke:var(--accent);stroke-width:3.4;}
  .graph-edge-weight{font-size:11px;font-weight:800;fill:var(--ink-faint);font-family:"JetBrains Mono",monospace;}
  .graph-node-circle{fill:var(--surface-2);stroke:var(--border-soft);stroke-width:2;}
  .graph-node.current .graph-node-circle{fill:var(--amber);stroke:var(--amber);}
  .graph-node.visited .graph-node-circle{fill:var(--teal);stroke:var(--teal);}
  .graph-node.selected .graph-node-circle{fill:var(--accent);stroke:var(--accent);}
  .graph-node.current text, .graph-node.visited text, .graph-node.selected text{fill:#fff;}
  .graph-node-label{font-size:14px;font-weight:800;fill:var(--ink);font-family:"Pretendard","Noto Sans KR",sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none;}
  .graph-node{cursor:pointer;}

  /* ===== DFS/BFS 스택·큐 패널 ===== */
  .ds-panel{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;}
  .ds-label{font-size:12.2px;font-weight:800;color:var(--ink-faint);}
  .ds-row{display:flex;gap:6px;}
  .ds-item{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:8px;padding:5px 11px;color:var(--ink);}
  .ds-item.top{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  /* ===== 다익스트라 거리표 ===== */
  .dijk-table-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .dijk-cell{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:7px 12px;min-width:52px;}
  .dijk-cell.in-s{background:var(--teal-soft);}
  .dijk-cell .dn{font-weight:900;font-size:13px;color:var(--ink);}
  .dijk-cell .dv{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;color:var(--accent);}

  /* ===== 개별 활동: 나만의 그래프 그려보기 ===== */
  .friend-hint{font-size:12.6px;color:var(--ink-faint);text-align:center;}
  .degree-list{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .degree-chip{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);}
  .degree-chip.max{background:var(--accent-soft);color:var(--accent);}


  /* ===== 개/고양이 분류 게임 (생각 열기) ===== */
  .catdog-card{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);border-radius:16px;padding:22px;max-width:360px;margin:0 auto;}
  .catdog-emoji{font-size:52px;}
  .catdog-desc{font-size:14px;font-weight:700;color:var(--ink);text-align:center;}
  .catdog-btn-row{display:flex;gap:10px;}
  .catdog-feedback{font-size:13px;font-weight:800;min-height:20px;text-align:center;}
  .catdog-feedback.ok{color:var(--teal);} .catdog-feedback.no{color:var(--danger);}
  .catdog-progress{font-size:12px;color:var(--ink-faint);font-weight:700;text-align:center;}

  /* ===== 기계 학습의 종류 분류 게임 ===== */
  .mlchip-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .mlchip{border:1.5px solid var(--border);border-radius:13px;padding:12px 14px;font-size:12.6px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:5px;align-items:center;min-width:128px;transition:.15s;}
  .mlchip:hover{border-color:var(--accent);}
  .mlchip .mlchip-cat{font-size:11px;font-weight:900;color:var(--accent);letter-spacing:.02em;}
  .mlchip.correct{border-color:var(--teal);background:var(--teal-soft);}
  .mlchip.incorrect{border-color:var(--danger);background:var(--danger-soft);}
  .mlchip-legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--ink-faint);font-weight:700;flex-wrap:wrap;}

  /* ===== 머신러닝 SVG 산점도 (k-NN, k-평균 공용) ===== */
  .ml-svg-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  .ml-svg-wrap svg{width:100%;height:100%;max-height:220px;background:var(--surface-2);border-radius:14px;}
  .ml-point{stroke:#fff;stroke-width:1.5;cursor:pointer;}
  .ml-point.classA{fill:var(--danger);}
  .ml-point.classB{fill:var(--teal);}
  .ml-point.test{fill:var(--amber);stroke-width:2.5;}
  .ml-link{stroke:var(--ink-faint);stroke-width:1.2;stroke-dasharray:3,3;}
  .ml-neighbor-circle{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4,4;}
  .ml-hint-text{font-size:11px;fill:var(--ink-faint);}
  .km-point{stroke:#fff;stroke-width:1.2;}
  .km-point.unassigned{fill:var(--ink-faint);}
  .km-point.c0{fill:var(--accent);} .km-point.c1{fill:var(--teal);} .km-point.c2{fill:var(--amber);}
  .km-centroid{stroke:#fff;stroke-width:2.5;}
  .km-centroid.c0{fill:var(--accent);} .km-centroid.c1{fill:var(--teal);} .km-centroid.c2{fill:var(--amber);}

  /* ===== k-NN 결과 박스 / 슬라이더 ===== */
  .ml-result-box{background:var(--surface-2);border-radius:11px;padding:11px 15px;font-size:13.2px;color:var(--ink);font-weight:700;min-height:20px;text-align:center;}
  .ml-k-row{display:flex;align-items:center;gap:10px;justify-content:center;}
  .ml-k-row input[type="range"]{width:160px;}
  .ml-k-badge{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:999px;}
  .ml-mode-row{display:flex;gap:8px;justify-content:center;}

  /* ===== 시그모이드 곡선 미니 차트 ===== */
  .sig-chart-wrap{display:flex;justify-content:center;}

  /* ===== 공식 강조 박스 (로지스틱 회귀 시그모이드 등) ===== */
  .hash-formula{text-align:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:15px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px;margin-bottom:2px;}

  /* ===== stepper 공용 (k-평균 스테퍼) ===== */
  .stepper-log{background:var(--surface-2);border-radius:11px;padding:11px 15px;font-size:13.2px;color:var(--ink);font-weight:700;min-height:20px;text-align:center;}
  .stepper-meta{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--ink-faint);font-weight:700;}
  .stepper-meta b{color:var(--accent);font-family:"JetBrains Mono",monospace;}

  /* ===== 개별 활동 힌트 텍스트 ===== */
  .friend-hint{font-size:12.6px;color:var(--ink-faint);text-align:center;}

  /* ===== 세로(포트레이트) 모니터 대응 — 화면 비율 기준, 폭이 넓어도 세로가 길면 적용 ===== */
  @media (max-aspect-ratio: 4/5){
    #deck-stage{max-width:760px;}
    .cols-2,.cols-3,.cols-4,.dc-wrap,.compare-grid,.sort-grid,.stepsim-wrap,.worksheet-grid,
    .stepper-wrap,.flowsim-wrap,.fare-wrap,.loop-wrap,.flip-grid,.bridge-sides,

    .topbar{padding:13px 22px 0!important;flex-wrap:wrap;row-gap:6px;}
    .pipeline{flex-direction:column!important;} .pipe-arrow{transform:rotate(90deg);width:auto;height:16px;}
    .elev-row{flex-direction:column!important;} .elev-card{max-width:none!important;}
    .graph-svg-wrap svg,.ml-svg-wrap svg{max-height:360px!important;}
    .array-row{height:190px!important;}
  }
  @media (max-aspect-ratio: 4/5) and (min-width:761px){
    .hub-grid{grid-template-columns:repeat(2,1fr)!important;}
  }

  /* ===== 주석(펜 그리기) 도구 ===== */
  #annotInk{position:fixed;inset:0;z-index:59;pointer-events:none;touch-action:none;}
  #annotCanvas{position:fixed;inset:0;z-index:60;pointer-events:none;touch-action:none;}
  #annotToolbar{position:fixed;top:16px;right:16px;z-index:110;display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 7px;box-shadow:var(--shadow);}
  #annotToolbar .at-btn{appearance:none;border:none;background:var(--surface-2);color:var(--ink);width:32px;height:32px;border-radius:9px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
  #annotToolbar .at-btn:hover{background:var(--accent-soft);color:var(--accent);}
  #annotToolbar .at-btn.active{background:var(--accent);color:var(--accent-ink);}
  #annotToolbar .at-sep{width:1px;height:20px;background:var(--border);margin:0 1px;}
  #annotThickWrap{position:fixed;top:64px;right:16px;z-index:110;display:none;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 13px;box-shadow:var(--shadow);}
  #annotThickWrap.show{display:flex;}
  #annotThickWrap .at-th-label{font-size:11.4px;font-weight:800;color:var(--ink-soft);white-space:nowrap;}
  #annotThickWrap input[type=range]{width:104px;accent-color:var(--accent);cursor:pointer;}
  #annotThickWrap .at-th-val{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:11.4px;color:var(--accent);min-width:26px;text-align:right;}
  @media print{ #annotInk,#annotCanvas,#annotToolbar,#annotThickWrap{display:none!important;} }
  @media (max-aspect-ratio: 4/5){
    #annotToolbar{top:8px;right:8px;padding:5px 6px;gap:4px;}
    #annotToolbar .at-btn{width:29px;height:29px;font-size:13px;}
    #annotThickWrap{top:52px;right:8px;padding:6px 10px;gap:6px;}
    #annotThickWrap input[type=range]{width:74px;}
  }

  /* ===== external practice-tool link cards (3-1 정렬 알고리즘) ===== */
  .card-link{text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .card-link:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm);}
  .card-link-arrow{margin-top:auto;font-size:11.5px;font-weight:800;color:var(--accent);}

  /* ===== 교과서 원본 C 코드 토글 (3-1 정렬 코드 슬라이드) ===== */
  .textbook-toggle-row{margin-top:12px;}
  .textbook-code-wrap{margin-top:10px;}
  .textbook-code-title{font-size:11.2px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .textbook-code-source{font-size:11px;color:var(--ink-faint);margin-top:6px;}

  /* ===== 코드 줄 클릭 → 줄 설명 (3-1 정렬 코드 슬라이드) ===== */
  .code-explain-wrap{display:flex;gap:14px;flex:1;min-height:210px;}
  .code-explain-wrap .code-block{flex:1;min-width:0;}
  .code-explain-wrap .cline[data-explain]{cursor:pointer;}
  .code-explain-wrap .cline[data-explain]:hover{background:rgba(109,151,245,.14);}
  .code-explain-side{width:220px;flex:none;background:var(--surface-2);border-radius:13px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .code-explain-label{font-size:11px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .code-explain-body{font-size:13px;line-height:1.6;color:var(--ink);font-weight:700;}
  .code-explain-body.placeholder{color:var(--ink-faint);font-weight:500;font-style:italic;}
  @media (max-width:760px){
    .code-explain-wrap{flex-direction:column;}
    .code-explain-side{width:auto;}
  }

<div id="hub">

  <section class="slide" data-kind="code" data-title="Python으로 표현한 학생 모델링" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">02. 모델링과 검증</span><span class="kind-tag">모델링 → 코드</span></div>

      <h1 class="h1">Student 클래스를 파이썬으로 정의하기</h1>
      <div class="code-block"><pre style="margin:0;"><span class="ln">1</span><span class="kw">class</span> Student:
<span class="ln">2</span>    <span class="kw">def</span> __init__(<span class="kw">self</span>, name, age, grade, stamina):
<span class="ln">3</span>        <span class="kw">self</span>.name = name        <span class="cm"># 이름</span>
<span class="ln">4</span>        <span class="kw">self</span>.age = age          <span class="cm"># 나이</span>
<span class="ln">5</span>        <span class="kw">self</span>.grade = grade      <span class="cm"># 성적</span>
<span class="ln">6</span>        <span class="kw">self</span>.stamina = stamina  <span class="cm"># 체력</span>
<span class="ln">7</span>
<span class="ln">8</span>    <span class="cm"># 공부하기: 성적을 향상시키는 메서드</span>
<span class="ln">9</span>    <span class="kw">def</span> study(<span class="kw">self</span>, d):
<span class="ln">10</span>        <span class="kw">self</span>.grade += d       <span class="cm"># 성적에 d만큼 더함</span>
<span class="ln">11</span>        <span class="kw">self</span>.stamina -= <span class="num">10</span>   <span class="cm"># 체력은 10만큼 감소</span>
<span class="ln">12</span>
<span class="ln">13</span>    <span class="cm"># 운동하기: 체력을 향상시키는 메서드</span>
<span class="ln">14</span>    <span class="kw">def</span> exercise(<span class="kw">self</span>, e):
<span class="ln">15</span>        <span class="kw">self</span>.stamina += e     <span class="cm"># 체력에 e만큼 더함</span>
<span class="ln">16</span>        <span class="kw">self</span>.grade -= <span class="num">0.1</span>   <span class="cm"># 성적은 0.1만큼 감소</span>
<span class="ln">17</span>
<span class="ln">18</span><span class="cm"># 학번 S01, 홍길동, 20세, 성적 3.5, 체력 50의 학생 객체 생성</span>
<span class="ln">19</span>student1 = Student(<span class="str">"홍길동"</span>, <span class="num">20</span>, <span class="num">3.5</span>, <span class="num">50</span>)
<span class="ln">20</span>student1.study(<span class="num">0.5</span>)      <span class="cm"># 공부하기 0.5</span>
<span class="ln">21</span>student1.exercise(<span class="num">20</span>)   <span class="cm"># 운동하기 20</span></pre></div>
      <div class="code-note-row">
        <span class="code-note"><b>__init__</b> — 객체가 생성될 때 속성을 초기화하는 메서드</span>
        <span class="code-note"><b>self</b> — 자기 자신(현재 객체)을 가리킨다</span>
      </div>

      <h1 class="h1">빅 오 표기법(big-O notation)이란?</h1>
      <p class="lead">알고리즘의 수행 결과는 속도나 온도처럼 숫자로 표기하기 힘들다. 빅 오 표기법은 알고리즘이 <b>입력 크기에 따라 얼마나 빨리 실행되는지 최악을 가정하여 표현</b>하는 방법으로, 시간 복잡도를 상한선(최악)으로 요약한다.</p>
      <div class="card-grid cols-3" style="margin-top:16px;">
        <div class="card"><h3>O[n] 표기</h3><p>그리스어 O(오미크론)를 이용해 빅 오[O(n)]라고 표기하며, n은 입력 데이터의 크기를 뜻한다.</p></div>

        <div class="card"><h3>간결하고 직관적</h3><p>다양한 알고리즘들의 성능을 간결하게 비교·선택하고, 일정을 계획하는 데 유용하다.</p></div>

          <tr><td class="strong">퀵 정렬</td><td>O(n log n)</td><td>피벗을 기준으로 데이터를 분할하는 과정을 재귀적으로 반복하며, 속도가 빠르다.</td></tr>
          <tr><td class="strong">힙 정렬</td><td>O(n log n)</td><td>데이터가 힙(heap) 자료 구조를 활용하며, 부가적인 메모리가 필요하지 않다.</td></tr>
          <tr><td class="strong">병합 정렬</td><td>O(n log n)</td><td>데이터를 분할하여 병합하는 과정에서 부가적인 메모리가 필요하다.</td></tr>
          <tr><td class="strong">셸 정렬</td><td>O(n<sup>1.5</sup>)</td><td>삽입 정렬의 단점을 보완하며, 설정에 따라 성능의 차이가 크다.</td></tr>
        </tbody>
      </table></div>
      <div class="insight-strip" style="margin-top:10px;">💡 정렬의 안정성: 동일한 키값을 가진 원소의 순서가 정렬 후에도 유지되면 안정적(stable) — 삽입·버블·병합 정렬이 해당한다.</div>
    </div>
  </section>

  <!-- 9 : 선택 정렬 코드 -->
  <section class="slide" data-kind="concept" data-title="선택 정렬 알고리즘" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">02. 대표 정렬 알고리즘</span><span class="kind-tag">코드</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 선택 정렬(selection sort)</span>
      <h1 class="h1">가장 작은 원소를 선택해 맨 앞과 교환한다</h1>
      <p class="lead" style="margin-bottom:10px;font-size:13.6px;">아직 정렬되지 않은 범위에서 가장 값이 작은 원소를 선택하고, 정렬되지 않은 부분의 맨 앞 원소와 교환하는 작업을 반복한다. 비교 횟수는 (n-1)+(n-2)+…+1 = n(n-1)/2 이므로 시간 복잡도는 O(n²)이다.</p>
      <div class="code-explain-wrap">
        <div class="code-block">
          <span class="cline" data-explain="정렬할 리스트 a를 매개변수로 받는 함수를 정의합니다."><span class="kw">def</span> selection_sort(a):</span>
          <span class="cline" data-explain="n에 리스트의 전체 원소 개수를 저장합니다.">&nbsp;&nbsp;n = len(a)</span>
          <span class="cline" data-explain="i를 0부터 n-2까지 증가시키며 반복합니다. (마지막 원소는 저절로 정렬되므로 n-1번만 반복)">&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> range(n - 1):</span>
          <span class="cline" data-explain="지금까지 찾은 최솟값의 위치를 일단 i로 가정합니다.">&nbsp;&nbsp;&nbsp;&nbsp;min_idx = i</span>
          <span class="cline" data-explain="i+1번째부터 마지막 원소까지, 아직 정렬되지 않은 구간을 훑습니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n):</span>
          <span class="cline" data-explain="j번째 값이 지금까지 찾은 최솟값보다 작으면">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> a[j] &lt; a[min_idx]:</span>
          <span class="cline" data-explain="최솟값의 위치를 j로 갱신합니다.">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;min_idx = j</span>
          <span class="cline" data-explain="찾은 최솟값을 정렬되지 않은 부분의 맨 앞자리(i번)와 맞바꿉니다.">&nbsp;&nbsp;&nbsp;&nbsp;a[i], a[min_idx] = a[min_idx], a[i]  <span class="cm"># 교환</span></span>
          <span class="cline" data-explain="정렬이 끝난 리스트를 반환합니다.">&nbsp;&nbsp;<span class="kw">return</span> a</span>
          <span class="cline">&nbsp;</span>
          <span class="cline" data-explain="정렬할 테스트 데이터를 만듭니다.">data = [32, 11, 31, 7, 19, 9, 37, 25]</span>
          <span class="cline" data-explain="함수를 호출하고 정렬된 결과를 출력합니다."><span class="kw">print</span>(selection_sort(data))</span>
        </div>
        <div class="code-explain-side">
          <div class="code-explain-label">💡 클릭한 줄 설명</div>
          <div class="code-explain-body placeholder" id="selExplainBody">코드를 한 줄씩 클릭해 보세요. 그 줄이 하는 일이 여기에 표시됩니다.</div>
        </div>
      </div>
      <div class="textbook-toggle-row">
        <button class="sim-btn textbook-toggle-btn" data-textbook-toggle type="button" aria-expanded="false">📘 교과서 원본 코드(C) 보기</button>
      </div>
      <div class="textbook-code-wrap" hidden>
        <p class="textbook-code-title">[실습 1] 선택 정렬 프로그램</p>
        <div class="code-explain-wrap">
          <div class="code-block">
            <span class="cline" data-explain="화면 출력 함수(printf)를 쓰기 위해 표준 입출력 라이브러리를 불러옵니다."><span class="kw">#include</span> &lt;stdio.h&gt;</span>
            <span class="cline" data-explain="정수 배열 A와 원소 개수 n을 받아 정렬하는 함수를 정의합니다. (A[0]~A[n-1]을 정렬)"><span class="kw">void</span> sel_sort(<span class="kw">int</span> A[], <span class="kw">int</span> n) {  <span class="cm">// A[0 ... n-1]을 정렬</span></span>
            <span class="cline" data-explain="최솟값의 위치를 저장할 min과 교환에 사용할 임시 변수 tmp를 선언합니다.">&nbsp;&nbsp;<span class="kw">int</span> min, tmp;</span>
            <span class="cline" data-explain="정렬을 시작하기 전, 원본 데이터를 보여주는 문구를 출력합니다.">&nbsp;&nbsp;printf("정렬 데이터: ");</span>
            <span class="cline" data-explain="배열 A의 모든 원소를 처음부터 끝까지 출력합니다.">&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> t=0; t&lt;n; t++) printf("%d ", A[t]);</span>
            <span class="cline" data-explain="줄을 바꾸고, 정렬 과정을 보여줄 것임을 알리는 문구를 출력합니다.">&nbsp;&nbsp;printf("\n정렬 과정 출력:");</span>
            <span class="cline" data-explain="i를 0부터 n-2까지 증가시키며 반복합니다. (마지막 원소는 저절로 정렬되므로 n-1번만 반복)">&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> i=0; i&lt;n-1; i++) {</span>
            <span class="cline" data-explain="지금까지 찾은 최솟값의 위치를 일단 i로 가정합니다.">&nbsp;&nbsp;&nbsp;&nbsp;min=i;</span>
            <span class="cline" data-explain="i+1번째부터 마지막 원소까지, 아직 정렬되지 않은 구간을 훑습니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> j=i+1; j&lt;n; j++)</span>
            <span class="cline" data-explain="j번째 값이 지금까지 찾은 최솟값보다 작으면 최솟값의 위치를 j로 갱신합니다.">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span>(A[j]&lt;A[min]) min=j;</span>
            <span class="cline" data-explain="교환을 위해 A[i]의 값을 임시 변수 tmp에 저장해 둡니다.">&nbsp;&nbsp;&nbsp;&nbsp;tmp=A[i];</span>
            <span class="cline" data-explain="찾은 최솟값 A[min]을 정렬되지 않은 부분의 맨 앞자리(A[i])로 옮깁니다.">&nbsp;&nbsp;&nbsp;&nbsp;A[i]=A[min];</span>
            <span class="cline" data-explain="원래 A[i]에 있던 값을 A[min] 자리로 옮겨 교환을 완료합니다.">&nbsp;&nbsp;&nbsp;&nbsp;A[min]=tmp;</span>
            <span class="cline" data-explain="몇 번째 단계인지(i+1단계) 보여주는 문구를 출력합니다.">&nbsp;&nbsp;&nbsp;&nbsp;printf("\n %d 단계:", i+1);</span>
            <span class="cline" data-explain="이번 단계까지 진행된 배열 A의 상태를 처음부터 끝까지 출력합니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> t=0; t&lt;n; t++) printf("%d ", A[t]);</span>
            <span class="cline" data-explain="i에 대한 반복문(바깥 for문)이 끝나는 지점입니다.">&nbsp;&nbsp;}</span>
            <span class="cline" data-explain="sel_sort 함수 정의가 끝나는 지점입니다.">}</span>
            <span class="cline" data-explain="프로그램이 실행을 시작하는 main 함수를 정의합니다."><span class="kw">int</span> main() {</span>
            <span class="cline" data-explain="정렬할 8개의 정수로 이루어진 배열 in을 초기화합니다.">&nbsp;&nbsp;<span class="kw">int</span> in[8]={32, 11, 31, 7, 19, 9, 37, 25};</span>
            <span class="cline" data-explain="배열 in과 원소 개수 8을 인자로 넘겨 선택 정렬 함수를 호출합니다.">&nbsp;&nbsp;sel_sort(in, 8);</span>
            <span class="cline" data-explain="프로그램이 정상적으로 종료되었음을 운영체제에 알립니다.">&nbsp;&nbsp;<span class="kw">return</span> 0;</span>
            <span class="cline" data-explain="main 함수 정의가 끝나는 지점입니다.">}</span>
          </div>
          <div class="code-explain-side">
            <div class="code-explain-label">💡 클릭한 줄 설명</div>
            <div class="code-explain-body placeholder" id="selCExplainBody">코드를 한 줄씩 클릭해 보세요. 그 줄이 하는 일이 여기에 표시됩니다.</div>
          </div>
        </div>
        <p class="textbook-code-source">출처: 교재 III단원 01. 정렬 알고리즘, p.98~99</p>
      </div>
    </div>
  </section>

  <!-- 10 : 버블 정렬 코드 -->
  <section class="slide" data-kind="concept" data-title="버블 정렬 알고리즘" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">02. 대표 정렬 알고리즘</span><span class="kind-tag">코드</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 버블 정렬(bubble sort)</span>
      <h1 class="h1">이웃한 두 원소를 비교해 거품처럼 떠오르게 한다</h1>
      <p class="lead" style="margin-bottom:10px;font-size:13.6px;">이웃한 두 원소의 크기를 비교하여 필요에 따라 교환을 반복하는 방식으로, 작은 값이 앞으로 한 단계씩 이동하는 과정이 거품이 수면 위로 올라가는 모습과 비슷하여 붙여진 이름이다.</p>
      <div class="code-explain-wrap">
        <div class="code-block">
          <span class="cline" data-explain="정렬할 리스트 a를 매개변수로 받는 함수를 정의합니다."><span class="kw">def</span> bubble_sort(a):</span>
          <span class="cline" data-explain="n에 리스트의 전체 원소 개수를 저장합니다.">&nbsp;&nbsp;n = len(a)</span>
          <span class="cline" data-explain="i를 1부터 n-1까지 증가시키며 반복합니다. (총 패스 횟수)">&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> range(1, n):</span>
          <span class="cline" data-explain="j를 마지막 인덱스(n-1)부터 i까지 하나씩 줄여가며 반복합니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j <span class="kw">in</span> range(n - 1, i - 1, -1):</span>
          <span class="cline" data-explain="뒤쪽 원소 a[j]가 바로 앞 원소 a[j-1]보다 작으면">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> a[j] &lt; a[j - 1]:</span>
          <span class="cline" data-explain="두 원소의 자리를 맞바꿉니다. (작은 값이 한 칸 앞으로 이동)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a[j], a[j - 1] = a[j - 1], a[j]  <span class="cm"># 교환</span></span>
          <span class="cline" data-explain="정렬이 끝난 리스트를 반환합니다.">&nbsp;&nbsp;<span class="kw">return</span> a</span>
        </div>
        <div class="code-explain-side">
          <div class="code-explain-label">💡 클릭한 줄 설명</div>
          <div class="code-explain-body placeholder" id="bubExplainBody">코드를 한 줄씩 클릭해 보세요. 그 줄이 하는 일이 여기에 표시됩니다.</div>
        </div>
      </div>
      <div class="insight-strip" style="margin-top:10px;">💡 개선 아이디어: 한 패스에서 교환이 한 번도 없으면 이미 정렬된 것이므로 즉시 종료할 수 있다. 홀수 패스는 작은 값을, 짝수 패스는 큰 값을 옮기는 방식을 양방향으로 결합한 것을 카테일 셰이커 정렬이라 한다.</div>
      <div class="textbook-toggle-row">
        <button class="sim-btn textbook-toggle-btn" data-textbook-toggle type="button" aria-expanded="false">📘 교과서 원본 코드(C) 보기</button>
      </div>
      <div class="textbook-code-wrap" hidden>
        <p class="textbook-code-title">[실습 2] 버블 정렬 프로그램</p>
        <div class="code-explain-wrap">
          <div class="code-block">
            <span class="cline" data-explain="화면 출력 함수(printf)를 쓰기 위해 표준 입출력 라이브러리를 불러옵니다."><span class="kw">#include</span> &lt;stdio.h&gt;</span>
            <span class="cline" data-explain="정수 배열 A와 원소 개수 n을 받아 정렬하는 함수를 정의합니다. (A[0]~A[n-1]을 정렬)"><span class="kw">void</span> bub_sort(<span class="kw">int</span> A[], <span class="kw">int</span> n) {  <span class="cm">// A[0 ... n-1]을 정렬</span></span>
            <span class="cline" data-explain="정렬을 시작하기 전, 원본 데이터를 보여주는 문구를 출력합니다.">&nbsp;&nbsp;printf("정렬 데이터: ");</span>
            <span class="cline" data-explain="배열 A의 모든 원소를 처음부터 끝까지 출력합니다.">&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> t=0; t&lt;n; t++) printf("%d ", A[t]);</span>
            <span class="cline" data-explain="줄을 바꾸고, 정렬 과정을 보여줄 것임을 알리는 문구를 출력합니다.">&nbsp;&nbsp;printf("\n정렬 과정 출력:");</span>
            <span class="cline" data-explain="i를 1부터 n-1까지 증가시키며 반복합니다. (총 패스 횟수)">&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> i=1; i&lt;n; i++) {</span>
            <span class="cline" data-explain="j를 마지막 인덱스(n-1)부터 i까지 하나씩 줄여가며 반복합니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> j=n-1; j&gt;=i; j--) {</span>
            <span class="cline" data-explain="뒤쪽 원소 A[j]가 바로 앞 원소 A[j-1]보다 작으면">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span>(A[j]&lt;A[j-1]) {</span>
            <span class="cline" data-explain="교환을 위해 A[j]의 값을 임시 변수 tmp에 저장해 둡니다.">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">int</span> tmp=A[j];</span>
            <span class="cline" data-explain="앞 원소 A[j-1]의 값을 A[j] 자리로 옮깁니다.">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;A[j]=A[j-1];</span>
            <span class="cline" data-explain="tmp에 저장해 둔 값을 A[j-1] 자리에 넣어 교환을 완료합니다. (작은 값이 한 칸 앞으로 이동)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;A[j-1]=tmp;</span>
            <span class="cline" data-explain="if문(교환 조건)이 끝나는 지점입니다.">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}</span>
            <span class="cline" data-explain="j에 대한 반복문(안쪽 for문)이 끝나는 지점입니다.">&nbsp;&nbsp;&nbsp;&nbsp;}</span>
            <span class="cline" data-explain="몇 번째 패스인지(i패스) 보여주는 문구를 출력합니다.">&nbsp;&nbsp;&nbsp;&nbsp;printf("\n %d 패스 :", i);</span>
            <span class="cline" data-explain="이번 패스까지 진행된 배열 A의 상태를 처음부터 끝까지 출력합니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> t=0; t&lt;n; t++) printf("%d ", A[t]);</span>
            <span class="cline" data-explain="i에 대한 반복문(바깥 for문)이 끝나는 지점입니다.">&nbsp;&nbsp;}</span>
            <span class="cline" data-explain="bub_sort 함수 정의가 끝나는 지점입니다.">}</span>
            <span class="cline" data-explain="프로그램이 실행을 시작하는 main 함수를 정의합니다."><span class="kw">int</span> main() {</span>
            <span class="cline" data-explain="정렬할 8개의 정수로 이루어진 배열 in을 초기화합니다.">&nbsp;&nbsp;<span class="kw">int</span> in[8]={32, 11, 31, 7, 19, 9, 37, 25};</span>
            <span class="cline" data-explain="배열 in과 원소 개수 8을 인자로 넘겨 버블 정렬 함수를 호출합니다.">&nbsp;&nbsp;bub_sort(in, 8);</span>
            <span class="cline" data-explain="프로그램이 정상적으로 종료되었음을 운영체제에 알립니다.">&nbsp;&nbsp;<span class="kw">return</span> 0;</span>
            <span class="cline" data-explain="main 함수 정의가 끝나는 지점입니다.">}</span>
          </div>
          <div class="code-explain-side">
            <div class="code-explain-label">💡 클릭한 줄 설명</div>
            <div class="code-explain-body placeholder" id="bubCExplainBody">코드를 한 줄씩 클릭해 보세요. 그 줄이 하는 일이 여기에 표시됩니다.</div>
          </div>
        </div>
        <p class="textbook-code-source">출처: 교재 III단원 01. 정렬 알고리즘, p.102</p>

  <!-- 11 : 삽입 정렬 코드 -->
  <section class="slide" data-kind="concept" data-title="삽입 정렬 알고리즘" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">02. 대표 정렬 알고리즘</span><span class="kind-tag">코드</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 삽입 정렬(insertion sort)</span>
      <h1 class="h1">이미 정렬된 부분에 새 원소를 알맞게 끼워 넣는다</h1>
      <p class="lead" style="margin-bottom:10px;font-size:13.6px;">아직 정렬되지 않은 원소 중 맨 앞에 있는 원소를 이미 정렬된 원소들 사이 알맞은 위치에 삽입하는 방식이다. 크기가 작거나 거의 정렬된 리스트에서는 시간 복잡도가 O(n)까지 개선된다.</p>
      <div class="code-explain-wrap">
        <div class="code-block">
          <span class="cline" data-explain="정렬할 리스트 a를 매개변수로 받는 함수를 정의합니다."><span class="kw">def</span> insertion_sort(a):</span>
          <span class="cline" data-explain="i를 1부터 마지막 인덱스까지 증가시키며 반복합니다. (첫 원소 a[0]은 이미 정렬된 것으로 취급)">&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> range(1, len(a)):</span>
          <span class="cline" data-explain="지금 삽입할 값을 tmp에 따로 저장해 둡니다. (&quot;손에 든 카드&quot;)">&nbsp;&nbsp;&nbsp;&nbsp;tmp = a[i]</span>
          <span class="cline" data-explain="비교할 위치를 나타내는 j를 i로 초기화합니다.">&nbsp;&nbsp;&nbsp;&nbsp;j = i</span>
          <span class="cline" data-explain="왼쪽 이웃(a[j-1])이 있고, 그 값이 tmp보다 크면 계속 반복합니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">while</span> j &gt; 0 <span class="kw">and</span> a[j - 1] &gt; tmp:</span>
          <span class="cline" data-explain="왼쪽 이웃 값을 한 칸 오른쪽(뒤)으로 밀어냅니다.">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a[j] = a[j - 1]  <span class="cm"># 뒤로 한 칸 이동(shift)</span></span>
          <span class="cline" data-explain="비교할 위치를 한 칸 왼쪽으로 옮깁니다.">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;j -= 1</span>
          <span class="cline" data-explain="더 밀어낼 필요가 없는 자리(알맞은 위치)에 tmp를 끼워 넣습니다.">&nbsp;&nbsp;&nbsp;&nbsp;a[j] = tmp  <span class="cm"># 알맞은 위치에 삽입</span></span>
          <span class="cline" data-explain="정렬이 끝난 리스트를 반환합니다.">&nbsp;&nbsp;<span class="kw">return</span> a</span>
        </div>
        <div class="code-explain-side">
          <div class="code-explain-label">💡 클릭한 줄 설명</div>
          <div class="code-explain-body placeholder" id="insExplainBody">코드를 한 줄씩 클릭해 보세요. 그 줄이 하는 일이 여기에 표시됩니다.</div>
        </div>
      </div>
      <div class="insight-strip" style="margin-top:10px;">💡 개선 아이디어: 삽입 위치를 순차 탐색 대신 이진 탐색으로 찾으면 O(n log n), 일정 간격으로 부분 집합을 구성해 삽입 정렬을 반복하는 방식을 셸 정렬이라 한다.</div>
      <div class="textbook-toggle-row">
        <button class="sim-btn textbook-toggle-btn" data-textbook-toggle type="button" aria-expanded="false">📘 교과서 원본 코드(C) 보기</button>
      </div>
      <div class="textbook-code-wrap" hidden>
        <p class="textbook-code-title">[실습 3] 삽입 정렬 프로그램</p>
        <div class="code-explain-wrap">
          <div class="code-block">
            <span class="cline" data-explain="화면 출력 함수(printf)를 쓰기 위해 표준 입출력 라이브러리를 불러옵니다."><span class="kw">#include</span> &lt;stdio.h&gt;</span>
            <span class="cline" data-explain="정수 배열 A와 원소 개수 n을 받아 정렬하는 함수를 정의합니다. (A[0]~A[n-1]을 정렬)"><span class="kw">void</span> ins_sort(<span class="kw">int</span> A[], <span class="kw">int</span> n) {  <span class="cm">// A[0 ... n-1]을 정렬</span></span>
            <span class="cline" data-explain="정렬을 시작하기 전, 원본 데이터를 보여주는 문구를 출력합니다.">&nbsp;&nbsp;printf("정렬 데이터: ");</span>
            <span class="cline" data-explain="배열 A의 모든 원소를 처음부터 끝까지 출력합니다.">&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> t=0; t&lt;n; t++) printf("%d ", A[t]);</span>
            <span class="cline" data-explain="줄을 바꾸고, 정렬 과정을 보여줄 것임을 알리는 문구를 출력합니다.">&nbsp;&nbsp;printf("\n정렬 과정 출력:");</span>
            <span class="cline" data-explain="i를 1부터 n-1까지 증가시키며 반복합니다. (첫 원소 A[0]은 이미 정렬된 것으로 취급)">&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> i=1; i&lt;n; i++) {</span>
            <span class="cline" data-explain="지금 삽입할 값을 tmp에 저장하고, 비교할 위치를 나타내는 j를 i로 초기화합니다. (&quot;손에 든 카드&quot;)">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">int</span> tmp=A[i], j=i;</span>
            <span class="cline" data-explain="왼쪽 이웃(A[j-1])이 있고, 그 값이 tmp보다 크면 계속 반복합니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">while</span>(j&gt;0 &amp;&amp; A[j-1]&gt;tmp)</span>
            <span class="cline" data-explain="왼쪽 이웃 값을 한 칸 뒤로 밀어내고, 비교할 위치를 한 칸 왼쪽으로 옮깁니다. (shift)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;A[j]=A[j-1], j=j-1;</span>
            <span class="cline" data-explain="더 밀어낼 필요가 없는 자리(알맞은 위치)에 tmp를 끼워 넣습니다.">&nbsp;&nbsp;&nbsp;&nbsp;A[j]=tmp;</span>
            <span class="cline" data-explain="몇 번째 단계인지(i단계) 보여주는 문구를 출력합니다.">&nbsp;&nbsp;&nbsp;&nbsp;printf("\n %d 단계 :", i);</span>
            <span class="cline" data-explain="이번 단계까지 정렬이 진행된 부분(A[0]~A[i])을 출력합니다.">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span>(<span class="kw">int</span> t=0; t&lt;=i; t++) printf("%d ", A[t]);</span>
            <span class="cline" data-explain="i에 대한 반복문(for문)이 끝나는 지점입니다.">&nbsp;&nbsp;}</span>
            <span class="cline" data-explain="ins_sort 함수 정의가 끝나는 지점입니다.">}</span>
            <span class="cline" data-explain="프로그램이 실행을 시작하는 main 함수를 정의합니다."><span class="kw">int</span> main() {</span>
            <span class="cline" data-explain="정렬할 8개의 정수로 이루어진 배열 in을 초기화합니다.">&nbsp;&nbsp;<span class="kw">int</span> in[8]={32, 11, 31, 7, 19, 9, 37, 25};</span>
            <span class="cline" data-explain="배열 in과 원소 개수 8을 인자로 넘겨 삽입 정렬 함수를 호출합니다.">&nbsp;&nbsp;ins_sort(in, 8);</span>
            <span class="cline" data-explain="프로그램이 정상적으로 종료되었음을 운영체제에 알립니다.">&nbsp;&nbsp;<span class="kw">return</span> 0;</span>
            <span class="cline" data-explain="main 함수 정의가 끝나는 지점입니다.">}</span>
          </div>
          <div class="code-explain-side">
            <div class="code-explain-label">💡 클릭한 줄 설명</div>
            <div class="code-explain-body placeholder" id="insCExplainBody">코드를 한 줄씩 클릭해 보세요. 그 줄이 하는 일이 여기에 표시됩니다.</div>
          </div>
        </div>

  <section class="slide" data-kind="interactive" data-title="더 깊이 연습하기 — 정렬 완전정복" data-tag="실습">
    <div class="topbar"><span class="breadcrumb">03. 정렬 알고리즘</span><span class="kind-tag">✨ 더 깊이 연습하기</span></div>

      <span class="kicker">Concept · 선형 탐색(linear search) · 순차 탐색</span>
      <h1 class="h1">처음부터 끝까지 차례대로 값을 비교한다</h1>
      <p class="lead" style="margin-bottom:10px;font-size:13.6px;">데이터 집합의 처음부터 마지막 원소까지 키값이 일치하는지 차례대로 비교한다. 원소가 n개일 때 평균 비교 횟수는 (1+2+…+n)/n = (n+1)/2이므로 시간 복잡도는 O(n)이다.</p>
      <div class="code-block">
        <span class="cline"><span class="kw">def</span> linear_search(a, key):</span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> range(len(a)):</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> a[i] == key:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> i&nbsp;&nbsp;<span class="cm"># 탐색 성공</span></span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">return</span> -1&nbsp;&nbsp;<span class="cm"># 탐색 실패</span></span>
        <span class="cline">&nbsp;</span>
        <span class="cline">data = [32, 11, 31, 7, 19, 9, 37, 25]</span>
        <span class="cline"><span class="kw">print</span>(linear_search(data, 7))</span>
      </div>
      <div class="insight-strip" style="margin-top:10px;">💡 정렬된 리스트라면 현재 탐색하는 값이 찾는 키값보다 큰 순간 실패로 판단해 비교 횟수를 줄일 수 있다. 색인 순차 탐색(index sequential search)은 정렬된 리스트를 일정 간격으로 나누어 해당 구간만 순차 탐색하는 기법이다.</div>
    </div>
  </section>

  <!-- 9 : 이진 탐색 코드 -->
  <section class="slide" data-kind="concept" data-title="이진 탐색 알고리즘" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">02. 대표 탐색 알고리즘</span><span class="kind-tag">코드</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 이진 탐색(binary search)</span>
      <h1 class="h1">정렬된 데이터의 가운데 값과 비교해 범위를 반씩 줄인다</h1>
      <p class="lead" style="margin-bottom:8px;font-size:13.2px;">오름차순이나 내림차순으로 정렬된 리스트에서만 적용할 수 있다. 가운데 원소(mid)와 찾는 값을 비교해 작으면 왼쪽, 크면 오른쪽 범위에서 반복한다(분할 정복). 범위가 매 단계 절반으로 줄어들므로 시간 복잡도는 O(log₂n)이다.</p>
      <div class="code-block">
        <span class="cline"><span class="kw">def</span> binary_search(a, key):</span>
        <span class="cline">&nbsp;&nbsp;low, high = 0, len(a) - 1</span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">while</span> low &lt;= high:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;mid = (low + high) // 2</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> a[mid] == key:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> mid&nbsp;&nbsp;<span class="cm"># 탐색 성공</span></span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">elif</span> a[mid] &lt; key:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;low = mid + 1&nbsp;&nbsp;<span class="cm"># 오른쪽에서 탐색</span></span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">else</span>:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;high = mid - 1&nbsp;&nbsp;<span class="cm"># 왼쪽에서 탐색</span></span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">return</span> -1&nbsp;&nbsp;<span class="cm"># 탐색 실패</span></span>
      </div>
      <div class="insight-strip" style="margin-top:9px;">💡 재귀 함수로도 구현할 수 있다: <code style="font-family:'JetBrains Mono',monospace;">binary_search(a, low, mid-1, key)</code> / <code style="font-family:'JetBrains Mono',monospace;">binary_search(a, mid+1, high, key)</code>를 호출하는 방식이다. 삽입·삭제가 잦다면 이진 탐색 트리(BST), AVL 트리, B-트리 같은 자료 구조가 더 유리하다.</div>
    </div>
  </section>

  <!-- 10 : 이진 탐색 트리 -->
  <section class="slide" data-kind="concept" data-title="이진 탐색 트리(BST)" data-tag="더 알아보기">
    <div class="topbar"><span class="breadcrumb">02. 대표 탐색 알고리즘</span><span class="kind-tag">더 알아보기</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 이진 탐색 트리(Binary Search Tree)</span>
      <h1 class="h1">삽입·삭제가 잦은 경우에 효율적인 자료 구조</h1>
      <p class="lead" style="margin-bottom:10px;font-size:13.4px;">이진 탐색 트리는 ① 모든 노드의 키값이 중복되지 않고 ② 왼쪽 서브 트리는 모두 부모보다 작은 값, ③ 오른쪽 서브 트리는 모두 부모보다 큰 값을 가지며 ④ 왼쪽·오른쪽 서브 트리도 각각 이진 탐색 트리인 이진트리이다. 루트에서 시작해 찾는 값이 작으면 왼쪽, 크면 오른쪽으로 내려가며 최대 트리의 높이만큼 탐색한다.</p>
      <div class="card-grid cols-3">
        <div class="card"><span class="num">AVL 트리</span><h3>균형 이진 탐색 트리</h3><p>좌우 서브 트리의 높이 차를 1 이하로 유지해 O(n)에 가까워지는 문제를 해결한다.</p></div>
        <div class="card"><span class="num">B-트리</span><h3>다진 균형 트리</h3><p>각 노드가 2보다 많은 자식을 가질 수 있으며, 분할과 병합으로 균형을 유지한다.</p></div>
        <div class="card"><span class="num">레드 블랙 트리</span><h3>색상 규칙 기반</h3><p>노드를 레드/블랙으로 칠해 균형을 유지하며 O(log n)의 효율적인 연산이 가능하다.</p></div>
      </div>
    </div>
  </section>

      <p class="lead" style="margin-bottom:10px;">해시 탐색은 순차·이진 탐색처럼 값을 반복적으로 비교하는 대신, <b>해시 함수</b>를 이용한 산술 연산으로 키의 위치(해시 주소)를 계산하여 곧바로 접근하는 탐색 기법이다. 데이터가 저장되는 공간을 해시 테이블이라 하며, 서로 다른 해시 주소로 접근한다면 시간 복잡도는 O(1)이 된다.</p>

        <div class="pipe-arrow">→</div>
        <div class="pipe-step"><span class="pn">03</span><h3>해시 주소</h3><p>해시 테이블에서 데이터가 저장될 위치</p></div>

      <h1 class="h1">오늘 배운 내용 정리</h1>

  <!-- 9 : DFS 코드 -->
  <section class="slide" data-kind="concept" data-title="깊이 우선 탐색 알고리즘" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">02. 그래프 탐색</span><span class="kind-tag">코드</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 깊이 우선 탐색(DFS, depth first search)</span>
      <h1 class="h1">갈 수 있는 데까지 깊이 들어간 뒤 되돌아온다</h1>
      <p class="lead" style="margin-bottom:8px;font-size:13.2px;">시작 정점에서 한 방향으로 갈 수 있는 최대 깊이까지 탐색하다가, 더 이상 갈 곳이 없으면 이전 단계로 돌아와(백트래킹) 다른 방향을 탐색한다. 재귀 함수로 구현하면 함수 호출 과정에서 시스템 스택을 자동으로 사용하므로 간단히 작성할 수 있다.</p>
      <div class="code-block">
        <span class="cline">visited = set()</span>
        <span class="cline"><span class="kw">def</span> dfs(graph, v):</span>
        <span class="cline">&nbsp;&nbsp;visited.add(v)&nbsp;&nbsp;<span class="cm"># 방문 표시</span></span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">print</span>(v, end=<span class="str">' '</span>)</span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">for</span> w <span class="kw">in</span> graph[v]:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> w <span class="kw">not in</span> visited:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;dfs(graph, w)&nbsp;&nbsp;<span class="cm"># 재귀 호출</span></span>
      </div>
      <div class="insight-strip" style="margin-top:9px;">💡 정점의 개수를 n, 간선의 개수를 e라 하면 인접 행렬로 구현할 경우 O(n²), 인접 리스트로 구현할 경우 O(n+e)의 시간이 걸린다.</div>
    </div>
  </section>

  <!-- 10 : BFS 코드 -->
  <section class="slide" data-kind="concept" data-title="너비 우선 탐색 알고리즘" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">02. 그래프 탐색</span><span class="kind-tag">코드</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 너비 우선 탐색(BFS, breadth first search)</span>
      <h1 class="h1">가까운 정점부터 차례로 넓게 탐색한다</h1>
      <p class="lead" style="margin-bottom:8px;font-size:13.2px;">시작 정점에 인접한 정점을 모두 차례로 방문한 다음, 방문했던 정점 순서대로 다시 탐색을 반복한다. 먼저 삽입된 자료가 먼저 삭제되는 큐(queue, FIFO) 자료 구조를 사용한다.</p>
      <div class="code-block">
        <span class="cline"><span class="kw">from</span> collections <span class="kw">import</span> deque</span>
        <span class="cline"><span class="kw">def</span> bfs(graph, start):</span>
        <span class="cline">&nbsp;&nbsp;visited = {start}</span>
        <span class="cline">&nbsp;&nbsp;q = deque([start])</span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">while</span> q:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;v = q.popleft()&nbsp;&nbsp;<span class="cm"># 큐의 맨 앞에서 삭제</span></span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">print</span>(v, end=<span class="str">' '</span>)</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> w <span class="kw">in</span> graph[v]:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> w <span class="kw">not in</span> visited:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;visited.add(w)</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;q.append(w)</span>
      </div>
      <div class="insight-strip" style="margin-top:9px;">💡 BFS도 시간 복잡도는 인접 행렬 O(n²), 인접 리스트 O(n+e)로 DFS와 같다. 재귀(혹은 스택)를 활용하는 DFS와 큐를 활용하는 BFS는 각각 장단점이 있으므로 문제 상황에 맞게 선택한다.</div>
    </div>
  </section>

  <section class="slide" data-kind="concept" data-title="다익스트라 최단 경로" data-tag="개념">
    <div class="topbar"><span class="breadcrumb">03. 최단 경로 알고리즘</span><span class="kind-tag">개념</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 다익스트라(Dijkstra) 최단 경로</span>
      <h1 class="h1">가장 가까운 정점부터 하나씩 확정해 나간다</h1>
      <p class="lead" style="margin-bottom:10px;font-size:13.2px;">최단 경로란 가중 그래프에서 두 정점 사이 경로의 길이(간선 가중치의 합)가 최소인 경로를 말한다. 다익스트라 알고리즘은 하나의 출발 정점에서 다른 모든 정점으로의 최단 경로를 구하며, 시작 정점에서 가장 가까운 정점을 경로에 추가하고, 추가된 정점에 의해 거리가 단축되는 경로가 있으면 값을 갱신하는 방식으로 동작한다. 음의 가중치를 가지는 그래프에는 사용할 수 없다.</p>
      <div class="hash-formula" style="background:var(--accent-soft);">d[w] = min( d[w], d[v] + G[v][w] )</div>
      <div class="insight-strip" style="margin-top:10px;">💡 S를 최단 경로가 확정된 정점들의 집합, d[i]를 출발점에서 정점 i까지의 거리라 하면 ① S에 속하지 않은 정점 중 d값이 최소인 v를 S에 추가 ② v에 인접한 정점 w의 d값을 갱신하는 과정을 모든 정점이 S에 포함될 때까지 반복한다.</div>
    </div>
  </section>

  <!-- 14 : 다익스트라 코드 -->
  <section class="slide" data-kind="concept" data-title="다익스트라 알고리즘 구현" data-tag="코드">
    <div class="topbar"><span class="breadcrumb">03. 최단 경로 알고리즘</span><span class="kind-tag">코드</span></div>
    <div class="slide-inner">
      <span class="kicker">Concept · 다익스트라 최단 경로 프로그램 구현</span>
      <h1 class="h1">인접 행렬과 거리 배열로 구현하는 다익스트라</h1>
      <div class="code-block">
        <span class="cline">INF = float(<span class="str">'inf'</span>)</span>
        <span class="cline"><span class="kw">def</span> dijkstra(G, s, n):</span>
        <span class="cline">&nbsp;&nbsp;S = [<span class="kw">False</span>] * n; d = G[s][:]</span>
        <span class="cline">&nbsp;&nbsp;S[s] = <span class="kw">True</span>; d[s] = 0</span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">for</span> _ <span class="kw">in</span> range(n - 1):</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;v = min((i <span class="kw">for</span> i <span class="kw">in</span> range(n) <span class="kw">if not</span> S[i]), key=<span class="kw">lambda</span> i: d[i])</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;S[v] = <span class="kw">True</span>&nbsp;&nbsp;<span class="cm"># 최단 거리 확정</span></span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> w <span class="kw">in</span> range(n):</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if not</span> S[w]:</span>
        <span class="cline">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;d[w] = min(d[w], d[v] + G[v][w])</span>
        <span class="cline">&nbsp;&nbsp;<span class="kw">return</span> d</span>
      </div>
    </div>
  </section>

<script>
(function(){
  /* ================= shared deck engine (re-initializable) ================= */
  var slides = [], total = 0, idx = 0;
  var deckActive = null;
  var deckCleanup = null;
  var counterEl = document.getElementById('counter');
  var progressFill = document.getElementById('progressFill');
  var tocList = document.getElementById('tocList');
  var tocOverlay = document.getElementById('toc-overlay');
  var deckStage = document.getElementById('deck-stage');
  var hubEl = document.getElementById('hub');
  var controlsEl = document.getElementById('controls');
  var railEl = document.getElementById('progressRailWrap');

  var UNIT_META = {
    u22:{ title:'02 문제 분해와 모델링' },
    u23:{ title:'03 알고리즘 설계' },
    u24:{ title:'04 알고리즘 성능 분석' },
    u31:{ title:'3-1 정렬 알고리즘' },
    u32:{ title:'3-2 탐색 알고리즘' },
    u33:{ title:'3-3 그래프 알고리즘' },
    u34:{ title:'3-4 분류 및 군집화 알고리즘' }
  };

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function render(){
    slides.forEach(function(s,i){ s.classList.toggle('active', i === idx); });
    counterEl.textContent = pad(idx+1) + ' / ' + pad(total);
    progressFill.style.width = (total ? ((idx+1)/total*100) : 0) + '%';
    Array.prototype.forEach.call(tocList.querySelectorAll('button'), function(b,i){ b.classList.toggle('current', i === idx); });
  }
  function go(n){ if(!deckActive) return; idx = Math.max(0, Math.min(total-1, n)); render(); }
  document.getElementById('prevBtn').addEventListener('click', function(){ go(idx-1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ go(idx+1); });

  function buildToc(){
    tocList.innerHTML = '';
    slides.forEach(function(s,i){
      var li = document.createElement('li');
      if(s.dataset.kind === 'divider'){ li.className = 'divider-row'; }
      var btn = document.createElement('button');
      btn.innerHTML = '<span class="idx">'+pad(i+1)+'</span><span>'+s.dataset.title+'</span>';
      btn.addEventListener('click', function(){ go(i); tocOverlay.classList.remove('open'); });
      li.appendChild(btn);
      tocList.appendChild(li);
    });
  }
  document.getElementById('tocBtn').addEventListener('click', function(){ if(deckActive) tocOverlay.classList.add('open'); });
  tocOverlay.addEventListener('click', function(e){ if(e.target === tocOverlay) tocOverlay.classList.remove('open'); });

  window.addEventListener('keydown', function(e){
    var tag = (e.target && e.target.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA'){ if(e.key !== 'Escape') return; }
    if(tocOverlay.classList.contains('open')){ if(e.key === 'Escape'){ tocOverlay.classList.remove('open'); } return; }
    if(!deckActive){ return; }
    if(e.key === 'ArrowRight' || e.key === 'PageDown'){ go(idx+1); e.preventDefault(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ go(idx-1); e.preventDefault(); }
    else if(e.key === 'Home'){ go(0); }
    else if(e.key === 'End'){ go(total-1); }
    else if(e.key === 'Escape'){ showHub(); }
    else if(e.key.toLowerCase() === 't'){ tocOverlay.classList.add('open'); }
    else if(e.key.toLowerCase() === 'f'){ toggleFullscreen(); }
  });

  var touchStartX = null;
  document.addEventListener('touchstart', function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(touchStartX === null || !deckActive) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){ dx < 0 ? go(idx+1) : go(idx-1); }
    touchStartX = null;
  }, {passive:true});

  /* 마우스 휠: 위로 스크롤 -> 이전 슬라이드, 아래로 스크롤 -> 다음 슬라이드
     (슬라이드 내부에 스크롤 가능한 콘텐츠가 있고 아직 끝까지 스크롤되지 않았다면 그 콘텐츠를 먼저 스크롤한다) */
  function findScrollable(el, dy){
    while(el && el !== document.body && el !== document.documentElement){
      var st = window.getComputedStyle(el);
      if((st.overflowY === 'auto' || st.overflowY === 'scroll') && el.scrollHeight > el.clientHeight + 1){
        var atTop = el.scrollTop <= 0;
        var atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
        if(dy < 0 && !atTop) return el;

    /* ===== 시간 복잡도 그래프 슬라이드 ===== */
    (function(){
      var svg = document.getElementById('gcSvg');
      var range = document.getElementById('gcRange');
      if(!svg || !range) return;
      var legendEl = document.getElementById('gcLegend');
      var nLabel = document.getElementById('gcN');
      var noteEl = document.getElementById('gcNote');
      var NMAX = 50;
      var W = 640, H = 390, L = 54, R = 16, T = 22, B = 40;
      var CURVES = [
        {k:'c1', name:'O(1)',       f:function(n){ return 1; }},
        {k:'c2', name:'O(log n)',   f:function(n){ return Math.log2(n); }},
        {k:'c3', name:'O(n)',       f:function(n){ return n; }},
        {k:'c4', name:'O(n log n)', f:function(n){ return n * Math.log2(n); }},
        {k:'c5', name:'O(n²)',      f:function(n){ return n * n; }}
      ];
      var visible = {c1:true, c2:true, c3:true, c4:true, c5:true};
      var NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, text){
        var e = document.createElementNS(NS, tag);
        for(var a in attrs) e.setAttribute(a, attrs[a]);
        if(text != null) e.textContent = text;
        return e;
      }
      function fmt(v){
        if(Math.abs(v - Math.round(v)) < 1e-9) return Math.round(v).toLocaleString('en-US');
        return '약 ' + (v < 10 ? v.toFixed(1) : Math.round(v).toLocaleString('en-US'));
      }
      function niceStep(max){
        var raw = max / 5;
        var mag = Math.pow(10, Math.floor(Math.log10(raw)));
        var r = raw / mag;
        return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag;
      }
      function draw(){
        var n = +range.value;
        nLabel.textContent = n;
        var vis = CURVES.filter(function(c){ return visible[c.k]; });
        var maxY = Math.max.apply(null, vis.map(function(c){ return c.f(NMAX); }));
        var step = niceStep(maxY);
        var yTop = Math.ceil(maxY / step) * step;
        function X(v){ return L + (v - 1) / (NMAX - 1) * (W - L - R); }
        function Y(v){ return H - B - v / yTop * (H - B - T); }
        svg.textContent = '';
        /* y 눈금 + 격자 */
        for(var t = 0; t <= yTop + 1e-9; t += step){
          svg.appendChild(el('line', {x1:L, x2:W - R, y1:Y(t), y2:Y(t), 'class':'gc-grid'}));
          svg.appendChild(el('text', {x:L - 7, y:Y(t) + 4, 'text-anchor':'end', 'class':'gc-tick'}, t.toLocaleString('en-US')));
        }
        /* x 눈금 */
        [1, 10, 20, 30, 40, 50].forEach(function(v){
          svg.appendChild(el('line', {x1:X(v), x2:X(v), y1:H - B, y2:H - B + 5, 'class':'gc-axis'}));
          svg.appendChild(el('text', {x:X(v), y:H - B + 19, 'text-anchor':'middle', 'class':'gc-tick'}, v));
        });
        svg.appendChild(el('line', {x1:L, x2:W - R, y1:H - B, y2:H - B, 'class':'gc-axis'}));
        svg.appendChild(el('line', {x1:L, x2:L, y1:T, y2:H - B, 'class':'gc-axis'}));
        svg.appendChild(el('text', {x:L, y:12, 'class':'gc-axname'}, '실행 횟수'));
        svg.appendChild(el('text', {x:W - R, y:H - 6, 'text-anchor':'end', 'class':'gc-axname'}, '입력 개수 n'));
        /* 곡선 */
        vis.forEach(function(c){
          var pts = [];
          for(var i = 1; i <= NMAX; i++) pts.push(X(i).toFixed(2) + ',' + Y(c.f(i)).toFixed(2));
          svg.appendChild(el('polyline', {points:pts.join(' '), 'class':'gc-line gc-' + c.k}));
        });
        /* 현재 n 표시 */
        svg.appendChild(el('line', {x1:X(n), x2:X(n), y1:T, y2:H - B, 'class':'gc-marker'}));
        vis.forEach(function(c){
          svg.appendChild(el('circle', {cx:X(n), cy:Y(c.f(n)), r:5, 'class':'gc-dot gc-' + c.k}));
        });
        /* 범례 + 값 */
        legendEl.textContent = '';
        CURVES.forEach(function(c){
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'gc-row' + (visible[c.k] ? '' : ' off');
          b.setAttribute('aria-pressed', visible[c.k] ? 'true' : 'false');
          var sw = document.createElement('span'); sw.className = 'gc-sw'; sw.style.background = 'var(--' + ({c1:'teal', c2:'violet', c3:'accent', c4:'amber', c5:'danger'})[c.k] + ')';
          var nm = document.createElement('span'); nm.className = 'gc-name'; nm.textContent = c.name;
          var vl = document.createElement('span'); vl.className = 'gc-val'; vl.textContent = fmt(c.f(n)) + '번';
          b.appendChild(sw); b.appendChild(nm); b.appendChild(vl);
          b.addEventListener('click', function(){
            var count = CURVES.filter(function(x){ return visible[x.k]; }).length;
            if(visible[c.k] && count === 1) return;
            visible[c.k] = !visible[c.k];
            draw();
          });
          legendEl.appendChild(b);
        });
        /* 해설 */
        if(n >= 2){
          var ratio = (n * n) / (n * Math.log2(n));
          noteEl.textContent = 'n = ' + n + '일 때 O(n²)의 실행 횟수는 O(n log n)의 약 ' + ratio.toFixed(1) + '배예요.';
        } else {
          noteEl.textContent = 'n을 오른쪽으로 움직여 보세요. n이 커질수록 선들의 간격이 벌어져요.';
        }
      }
      range.addEventListener('input', draw);
      draw();
    })();


  /* ================= slide 1 : 버튼 없는 엘리베이터 (애니메이션) ================= */
  (function(){
    var elevators = [{id:'A', floor:1}, {id:'B', floor:5}, {id:'C', floor:9}];
    var targets = [3, 6, 10];
    var FH = 26, FLOORS = 10;
    var bld = document.getElementById('evBuilding');
    var targetRow = document.getElementById('elevTargets');
    var calcEl = document.getElementById('evCalc');
    var msg = document.getElementById('elevMsg');
    if(!bld || !targetRow) return;
    var cars = {}, dists = {}, rows = {}, heads = {};
    var run = 0;

    function bottomOf(f){ return (f - 1) * FH; }
    /* 건물 만들기 */
    var colLabels = document.createElement('div');
    colLabels.className = 'ev-col';
    for(var f = 1; f <= FLOORS; f++){
      var fl = document.createElement('div');
      fl.className = 'ev-flabel';
      fl.style.bottom = bottomOf(f) + 'px';
      fl.textContent = f + '층';
      colLabels.appendChild(fl);
    }
    bld.appendChild(colLabels);
    elevators.forEach(function(e){
      var col = document.createElement('div');
      col.className = 'ev-col shaft';
      var head = document.createElement('div');
      head.className = 'ev-head';
      head.innerHTML = '<b>' + e.id + '</b><span>현재 ' + e.floor + '층</span>';
      heads[e.id] = head.querySelector('span');
      col.appendChild(head);
      var dist = document.createElement('div');
      dist.className = 'ev-dist';
      dist.innerHTML = '<span></span>';
      col.appendChild(dist);
      var car = document.createElement('div');
      car.className = 'ev-car';
      car.style.bottom = bottomOf(e.floor) + 'px';
      car.innerHTML = '<div class="in"></div><div class="dl"></div><div class="dr"></div>';
      col.appendChild(car);
      cars[e.id] = car; dists[e.id] = dist;
      bld.appendChild(col);
    });
    var waitCol = document.createElement('div');
    waitCol.className = 'ev-col';
    var tline = document.createElement('div');
    tline.className = 'ev-tline';
    bld.appendChild(tline);
    var pax = document.createElement('div');
    pax.className = 'ev-pax';
    pax.innerHTML = '<i></i><span>승객</span>';
    waitCol.appendChild(pax);
    bld.appendChild(waitCol);
    /* tline 은 건물 전체 기준 위치 → 건물 padding-top(38px) 고려 */
    function placeTline(t){ tline.style.top = (38 + (FLOORS - t) * FH + FH / 2) + 'px'; }

    /* 계산 패널 */
    elevators.forEach(function(e){
      var r = document.createElement('div');
      r.className = 'ev-row';
      r.innerHTML = '<b>' + e.id + '</b><span>현재 ' + e.floor + '층</span><span class="calc">거리: 계산 전</span>';
      rows[e.id] = r;
      calcEl.appendChild(r);
    });

    function wait(ms, my){
      return new Promise(function(res){ setTimeout(function(){ res(my === run); }, ms); });
    }
    function resetVisual(){
      var moved = false;
      elevators.forEach(function(e){
        var car = cars[e.id];
        if(car.style.bottom !== bottomOf(e.floor) + 'px') moved = true;
        car.style.bottom = bottomOf(e.floor) + 'px';
        car.className = 'ev-car';
        dists[e.id].className = 'ev-dist';
        heads[e.id].textContent = '현재 ' + e.floor + '층';
        rows[e.id].className = 'ev-row';
        rows[e.id].querySelector('.calc').textContent = '거리: 계산 전';
      });
      pax.className = 'ev-pax';
      tline.className = 'ev-tline';
      return moved;
    }

    async function play(t, btn){
      var my = ++run;
      Array.prototype.forEach.call(targetRow.children, function(b){ b.classList.toggle('active', b === btn); });
      var moved = resetVisual();
      if(moved && !(await wait(1200, my))) return;
      /* 1) 승객이 목적층을 선택 */
      pax.style.bottom = bottomOf(t) + 'px';
      pax.className = 'ev-pax on';
      placeTline(t);
      tline.className = 'ev-tline on';
      msg.textContent = '🧍 승객이 ' + t + '층을 선택했어요. 컴퓨터가 엘리베이터마다 거리를 계산해요.';
      if(!(await wait(800, my))) return;
      /* 2) 엘리베이터별 거리 계산 */
      var best = null, bestDist = Infinity, ds = {};
      for(var i = 0; i < elevators.length; i++){
        var e = elevators[i];
        var d = Math.abs(e.floor - t);
        ds[e.id] = d;
        cars[e.id].classList.add('check');
        rows[e.id].classList.add('now');
        rows[e.id].querySelector('.calc').textContent = '|' + e.floor + ' − ' + t + '| = ' + d + '층 차이';
        var dl = dists[e.id];
        var lo = Math.min(e.floor, t), hi = Math.max(e.floor, t);
        dl.style.bottom = (bottomOf(lo) + FH / 2) + 'px';
        dl.style.height = ((hi - lo) * FH) + 'px';
        dl.querySelector('span').textContent = d + '층';
        dl.classList.add('on');
        if(!(await wait(900, my))) return;
        cars[e.id].classList.remove('check');
        rows[e.id].classList.remove('now');
        rows[e.id].classList.add('done');
        if(d < bestDist){ bestDist = d; best = e; }
      }
      /* 3) 가장 가까운 엘리베이터 결정 */
      var ties = elevators.filter(function(x){ return x !== best && ds[x.id] === bestDist; });
      elevators.forEach(function(x){
        if(x === best){ cars[x.id].classList.add('win'); rows[x.id].classList.add('winner'); }
        else { cars[x.id].classList.add('dim'); dists[x.id].classList.remove('on'); }
      });
      msg.textContent = '✅ ' + best.id + ' 엘리베이터가 ' + bestDist + '층 차이로 가장 가까워요.' +
        (ties.length ? ' (' + ties.map(function(x){ return x.id; }).join('·') + '도 같은 거리라서, 먼저 확인한 ' + best.id + '를 배정해요.)' : '');
      if(!(await wait(1000, my))) return;
      /* 4) 배정된 엘리베이터가 이동 */
      dists[best.id].classList.remove('on');
      cars[best.id].style.bottom = bottomOf(t) + 'px';
      if(!(await wait(300 + 1100 + 150 * bestDist, my))) return;
      heads[best.id].textContent = '현재 ' + t + '층';
      cars[best.id].classList.add('open');
      if(!(await wait(650, my))) return;
      pax.classList.remove('on');
      cars[best.id].classList.add('occupied');
      if(!(await wait(500, my))) return;
      cars[best.id].classList.remove('open');
      msg.textContent = '💡 ' + t + '층 승객에게는 ' + best.id + ' 엘리베이터(출발 ' + best.floor + '층)가 배정돼요 — 여러 엘리베이터의 거리를 계산해 가장 빠른 것을 고르는 것도 알고리즘! 이 알고리즘이 얼마나 효율적인지 평가하는 방법을 오늘 배워보자.';
    }

    targets.forEach(function(t){
      var btn = document.createElement('button');
      btn.className = 'elev-target-btn';
      btn.type = 'button';
      btn.textContent = t + '층으로 가기';
      btn.addEventListener('click', function(){ play(t, btn); });

      function push(cur,cmpArr,swapArr,log){ steps.push({arr:a.slice(), cur:cur||[], cmp:cmpArr||[], swap:swapArr||[], sorted:sortedIdx.slice(), cmpCount:cmp, swapCount:swp, log:log}); }

      for(var i=1;i<n;i++){

          push([j,j-1], [], [j,j-1], '인덱스 '+(j-1)+'(값 '+a[j-1]+') > '+tmp+' 이므로 뒤로 한 칸 이동시킵니다.');

  /* ================= slide 13-2 : 버킷에 직접 넣어 보기 (넣기 → 찾기) ================= */
  (function(){

    var timers = [];

        s.textContent = sub;

    function renderCalc(){

    function renderTable(hl){

  function initU33(){

  /* ================= shared: SVG graph drawing helper ================= */
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function drawGraph(svg, nodes, edges, opts){
    opts = opts || {};
    var r = opts.r || 20;
    var fontSize = opts.fontSize || 14;
    svg.innerHTML = '';
    edges.forEach(function(e){
      var a = nodes[e[0]], b = nodes[e[1]];
      if(!a || !b) return;
      var line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
      line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
      line.setAttribute('class', 'graph-edge' + (opts.edgeClass ? (' ' + opts.edgeClass(e)) : ''));
      svg.appendChild(line);
      if(e[2] !== undefined){
        var text = document.createElementNS(SVG_NS, 'text');
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        var dx = b.x - a.x, dy = b.y - a.y;
        var len = Math.sqrt(dx*dx + dy*dy) || 1;
        var offx = -dy / len * 12, offy = dx / len * 12;
        text.setAttribute('x', mx + offx);
        text.setAttribute('y', my + offy);
        text.setAttribute('class', 'graph-edge-weight');
        text.setAttribute('text-anchor', 'middle');
        text.textContent = e[2];
        svg.appendChild(text);
      }
    });
    Object.keys(nodes).forEach(function(id){
      var n = nodes[id];
      var g = document.createElementNS(SVG_NS, 'g');
      var extraCls = opts.nodeClass ? opts.nodeClass(id) : '';
      g.setAttribute('class', 'graph-node' + (extraCls ? ' ' + extraCls : ''));
      var circle = document.createElementNS(SVG_NS, 'circle');
      circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); circle.setAttribute('r', r);
      circle.setAttribute('class', 'graph-node-circle');
      g.appendChild(circle);
      var text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', n.x); text.setAttribute('y', n.y);
      text.setAttribute('class', 'graph-node-label');
      text.setAttribute('font-size', fontSize);
      text.textContent = opts.nodeLabel ? opts.nodeLabel(id) : id;
      g.appendChild(text);
      if(opts.onNodeClick){ g.addEventListener('click', function(){ opts.onNodeClick(id); }); }
      svg.appendChild(g);
    });
  }
