  /* ================= slide 8 : DFS/BFS 단계별 시뮬레이터 (flagship) ================= */
  (function(){
    var GS_NODES = {1:{x:210,y:28},2:{x:90,y:100},3:{x:210,y:100},4:{x:330,y:100},5:{x:150,y:175},6:{x:270,y:175}};
    var GS_EDGES = [[1,2],[1,3],[1,4],[2,5],[3,5],[5,6]];
    var GS_ADJ = {};
    GS_EDGES.forEach(function(e){
      GS_ADJ[e[0]] = GS_ADJ[e[0]] || []; GS_ADJ[e[0]].push(e[1]);
      GS_ADJ[e[1]] = GS_ADJ[e[1]] || []; GS_ADJ[e[1]].push(e[0]);
    });
    Object.keys(GS_ADJ).forEach(function(k){ GS_ADJ[k].sort(function(a,b){ return a - b; }); });

    var gsSvg = document.getElementById('gsSvg');
    var gsDsLabel = document.getElementById('gsDsLabel');
    var gsDsRow = document.getElementById('gsDsRow');
    var gsLog = document.getElementById('gsLog');
    var gsOrder = document.getElementById('gsOrder');
    var gsStepNum = document.getElementById('gsStepNum');
    var gsStepTotal = document.getElementById('gsStepTotal');
    var gsNextBtn = document.getElementById('gsNextBtn');
    var gsResetBtn = document.getElementById('gsResetBtn');
    var tabs = Array.prototype.slice.call(document.querySelectorAll('#graphSearchTabs .tab-btn'));

    function genDFS(start){
      var steps = [], visited = [], visitedSet = {}, order = [];
      function push(cur, log, ds){ steps.push({visited:visited.slice(), current:cur, order:order.slice(), ds:ds.slice(), log:log}); }
      var callStack = [{node:start, idx:0}];
      visitedSet[start] = true; visited.push(start); order.push(start);
      push(start, '정점 ' + start + '을 방문합니다.', callStack.map(function(f){ return f.node; }));
      while(callStack.length){
        var top = callStack[callStack.length - 1];
        var neighbors = GS_ADJ[top.node] || [];
        if(top.idx < neighbors.length){
          var w = neighbors[top.idx];
          top.idx++;
          if(!visitedSet[w]){
            visitedSet[w] = true; visited.push(w); order.push(w);
            callStack.push({node:w, idx:0});
            push(w, '정점 ' + top.node + '에서 인접한 미방문 정점 ' + w + '을 방문합니다.', callStack.map(function(f){ return f.node; }));
          } else {
            push(top.node, '정점 ' + w + '은 이미 방문했으므로 다음 인접 정점을 확인합니다.', callStack.map(function(f){ return f.node; }));
          }
        } else {
          callStack.pop();
          push(callStack.length ? callStack[callStack.length-1].node : null, '정점 ' + top.node + '에서 더 이상 방문할 정점이 없어 이전 단계로 돌아갑니다(백트래킹).', callStack.map(function(f){ return f.node; }));
        }
      }
      push(null, '✅ 모든 정점 방문을 완료했습니다! 방문 순서: ' + order.join(' → '), []);
      return steps;
    }
    function genBFS(start){
      var steps = [], visited = [], visitedSet = {}, queue = [start], order = [];
      function push(cur, log, ds){ steps.push({visited:visited.slice(), current:cur, order:order.slice(), ds:ds.slice(), log:log}); }
      visitedSet[start] = true; visited.push(start);
      push(start, '정점 ' + start + '을 방문하고 큐에 삽입합니다.', queue.slice());
      while(queue.length){
        var v = queue.shift();
        order.push(v);
        push(v, '큐의 맨 앞 정점 ' + v + '을 꺼내 처리합니다.', queue.slice());
        var neighbors = GS_ADJ[v] || [];
        for(var i=0;i<neighbors.length;i++){
          var w = neighbors[i];
          if(!visitedSet[w]){
            visitedSet[w] = true; visited.push(w); queue.push(w);
            push(v, '정점 ' + v + '의 인접 정점 ' + w + '을 방문하고 큐에 삽입합니다.', queue.slice());
          }
        }
      }
      push(null, '✅ 모든 정점 방문을 완료했습니다! 방문 순서: ' + order.join(' → '), []);
      return steps;
    }

    var gsMode = 'dfs';
    var gsSteps = [];
    var gsStepIdx = 0;

    function renderGS(){
      var step = gsSteps[gsStepIdx];
      drawGraph(gsSvg, GS_NODES, GS_EDGES, {
        nodeClass: function(id){
          var nid = parseInt(id, 10);
          if(nid === step.current) return 'current';
          if(step.visited.indexOf(nid) >= 0) return 'visited';
          return '';
        }
      });
      gsDsLabel.textContent = gsMode === 'dfs' ? '스택:' : '큐:';
      gsDsRow.innerHTML = '';
      step.ds.forEach(function(v, i){
        var item = document.createElement('div');
        var isTop = gsMode === 'dfs' ? (i === step.ds.length - 1) : (i === 0);
        item.className = 'ds-item' + (isTop ? ' top' : '');
        item.textContent = v;
        gsDsRow.appendChild(item);
      });
      gsLog.textContent = step.log;
      gsOrder.textContent = step.order.length ? step.order.join(' → ') : '-';
      gsStepNum.textContent = gsStepIdx + 1;
      gsStepTotal.textContent = gsSteps.length;
      var atEnd = gsStepIdx >= gsSteps.length - 1;
      gsNextBtn.textContent = atEnd ? '완료 ✓' : '다음 단계 ▶';
      gsNextBtn.disabled = atEnd;
    }
    function resetGS(){
      gsSteps = gsMode === 'dfs' ? genDFS(1) : genBFS(1);
      gsStepIdx = 0;
      renderGS();
    }
    gsNextBtn.addEventListener('click', function(){ if(gsStepIdx < gsSteps.length - 1){ gsStepIdx++; renderGS(); } });
    gsResetBtn.addEventListener('click', resetGS);
    tabs.forEach(function(btn){
      btn.addEventListener('click', function(){
        tabs.forEach(function(b){ b.classList.toggle('active', b === btn); });
        gsMode = btn.dataset.tab;
        resetGS();
      });
    });
    resetGS();
  })();

  /* ================= slide 13 : 다익스트라 시뮬레이터 (flagship) ================= */
  (function(){
    var DIJK_NODES = {A:{x:210,y:26},B:{x:70,y:120},C:{x:350,y:120},D:{x:140,y:200},E:{x:300,y:200}};
    var DIJK_EDGES = [['A','B',4],['A','C',2],['B','C',1],['B','D',5],['C','D',8],['C','E',10],['D','E',2]];
    var dijkSvg = document.getElementById('dijkSvg');
    var dijkTable = document.getElementById('dijkTable');
    var dijkLog = document.getElementById('dijkLog');
    var dijkSEl = document.getElementById('dijkS');
    var dijkStepNum = document.getElementById('dijkStepNum');
    var dijkStepTotal = document.getElementById('dijkStepTotal');
    var dijkNextBtn = document.getElementById('dijkNextBtn');
    var dijkResetBtn = document.getElementById('dijkResetBtn');

    function genDijkstra(start){
      var nodes = Object.keys(DIJK_NODES);
      var adj = {};
      nodes.forEach(function(n){ adj[n] = {}; });
      DIJK_EDGES.forEach(function(e){ adj[e[0]][e[1]] = e[2]; adj[e[1]][e[0]] = e[2]; });
      var d = {}; nodes.forEach(function(n){ d[n] = Infinity; });
      d[start] = 0;
      var S = [];
      var steps = [];
      function push(cur, log){ steps.push({d:Object.assign({}, d), S:S.slice(), current:cur, log:log}); }
      push(null, '출발 정점 ' + start + '의 거리를 0으로 설정하고 시작합니다.');
      while(S.length < nodes.length){
        var candidates = nodes.filter(function(n){ return S.indexOf(n) < 0 && d[n] < Infinity; });
        if(candidates.length === 0) break;
        candidates.sort(function(a,b){ return d[a] - d[b]; });
        var v = candidates[0];
        S.push(v);
        push(v, '집합 S에 속하지 않은 정점 중 거리값이 가장 작은 정점 ' + v + '(거리 ' + d[v] + ')을 확정합니다.');
        Object.keys(adj[v]).forEach(function(w){
          if(S.indexOf(w) < 0){
            var newDist = d[v] + adj[v][w];
            if(newDist < d[w]){
              d[w] = newDist;
              push(v, '정점 ' + v + '을 거쳐 정점 ' + w + '로 가는 거리 ' + newDist + '가 더 짧으므로 갱신합니다.');
            }
          }
        });
      }
      push(null, '✅ 모든 정점의 최단 거리가 확정되었습니다!');
      return steps;
    }

    var dijkSteps = [];
    var dijkStepIdx = 0;

    function renderDijk(){
      var step = dijkSteps[dijkStepIdx];
      drawGraph(dijkSvg, DIJK_NODES, DIJK_EDGES, {
        nodeClass: function(id){
          if(id === step.current) return 'current';
          if(step.S.indexOf(id) >= 0) return 'visited';
          return '';
        }
      });
      dijkTable.innerHTML = '';
      Object.keys(DIJK_NODES).forEach(function(id){
        var cell = document.createElement('div');
        cell.className = 'dijk-cell' + (step.S.indexOf(id) >= 0 ? ' in-s' : '');
        var dn = document.createElement('div'); dn.className = 'dn'; dn.textContent = id;
        var dv = document.createElement('div'); dv.className = 'dv'; dv.textContent = (step.d[id] === Infinity ? '∞' : step.d[id]);
        cell.appendChild(dn); cell.appendChild(dv);
        dijkTable.appendChild(cell);
      });
      dijkLog.textContent = step.log;
      dijkSEl.textContent = '{ ' + step.S.join(', ') + ' }';
      dijkStepNum.textContent = dijkStepIdx + 1;
      dijkStepTotal.textContent = dijkSteps.length;
      var atEnd = dijkStepIdx >= dijkSteps.length - 1;
      dijkNextBtn.textContent = atEnd ? '완료 ✓' : '다음 단계 ▶';
      dijkNextBtn.disabled = atEnd;
    }
    function resetDijk(){
      dijkSteps = genDijkstra('A');
      dijkStepIdx = 0;
      renderDijk();
    }
    dijkNextBtn.addEventListener('click', function(){ if(dijkStepIdx < dijkSteps.length - 1){ dijkStepIdx++; renderDijk(); } });
    dijkResetBtn.addEventListener('click', resetDijk);
    resetDijk();
  })();

  /* ================= slide 15 : 나만의 그래프 그려보기 (개별 활동) ================= */
  (function(){
    var names = ['민준', '서연', '도윤', '하은', '지호'];
    var svg = document.getElementById('friendSvg');
    var degreesEl = document.getElementById('friendDegrees');
    var resetBtn = document.getElementById('friendResetBtn');
    var nodes = {};
    var cx = 210, cy = 110, r = 82;
    names.forEach(function(name, i){
      var angle = -Math.PI/2 + i * (2*Math.PI/names.length);
      nodes[name] = {x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle)};
    });
    var edges = [];
    var pending = null;

    function edgeKey(a, b){ return [a,b].sort().join('|'); }
    function toggleEdge(a, b){
      if(a === b) return;
      var idx = -1;
      for(var i=0;i<edges.length;i++){ if(edgeKey(edges[i][0], edges[i][1]) === edgeKey(a,b)){ idx = i; break; } }
      if(idx >= 0) edges.splice(idx, 1);
      else edges.push([a, b]);
    }
    function degrees(){
      var deg = {};
      names.forEach(function(n){ deg[n] = 0; });
      edges.forEach(function(e){ deg[e[0]]++; deg[e[1]]++; });
      return deg;
    }
    function render(){
      drawGraph(svg, nodes, edges, {
        r: 24, fontSize: 12,
        nodeClass: function(id){ return id === pending ? 'selected' : ''; },
        onNodeClick: function(id){
          if(pending === null){ pending = id; }
          else if(pending === id){ pending = null; }
          else { toggleEdge(pending, id); pending = null; }
          render();
        }
      });
      var deg = degrees();
      var maxDeg = Math.max.apply(null, names.map(function(n){ return deg[n]; }));
      degreesEl.innerHTML = '';
      names.forEach(function(n){
        var chip = document.createElement('span');
        chip.className = 'degree-chip' + (deg[n] === maxDeg && maxDeg > 0 ? ' max' : '');
        chip.textContent = n + ' ' + deg[n];
        degreesEl.appendChild(chip);
      });
    }
    resetBtn.addEventListener('click', function(){ edges = []; pending = null; render(); });
    render();
  })();

  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs, text){

  /* ================= slide 15 : k-평균 클러스터링 시뮬레이터 (flagship) ================= */
  (function(){
    var KM_POINTS = [
      {x:70,y:50},{x:95,y:65},{x:60,y:80},{x:100,y:45},
      {x:320,y:55},{x:350,y:70},{x:300,y:50},{x:340,y:90},
      {x:190,y:150},{x:220,y:170},{x:170,y:175},{x:230,y:150}
    ];
    var INIT_CENTROIDS = [{x:70,y:50},{x:320,y:55},{x:190,y:150}];

    function cloneCentroids(cs){ return cs.map(function(c){ return {x:c.x, y:c.y}; }); }

    function genKMeans(points, initCentroids, maxIter){
      var steps = [];
      var centroids = cloneCentroids(initCentroids);
      var assignments = points.map(function(){ return -1; });
      steps.push({assignments: assignments.slice(), centroids: cloneCentroids(centroids), log: '3개의 초기 중심점을 실제 데이터 중에서 선택했습니다. 다음 단계를 눌러 군집 할당을 시작해 보세요.'});
      var prevAssignments = null;
      for(var iter = 1; iter <= maxIter; iter++){
        var newAssignments = points.map(function(p){
          var best = 0, bestD = Infinity;
          centroids.forEach(function(c, ci){
            var dx = p.x - c.x, dy = p.y - c.y;
            var d = dx*dx + dy*dy;
            if(d < bestD){ bestD = d; best = ci; }
          });
          return best;
        });
        var changed = !prevAssignments || newAssignments.some(function(a, i){ return a !== prevAssignments[i]; });
        assignments = newAssignments;
        steps.push({assignments: assignments.slice(), centroids: cloneCentroids(centroids), log: iter + '번째 반복: 각 데이터를 가장 가까운 중심점의 군집에 할당합니다.'});
        if(!changed){
          steps.push({assignments: assignments.slice(), centroids: cloneCentroids(centroids), log: '✅ 군집 할당이 이전 단계와 같아 더 이상 변화가 없으므로 알고리즘을 종료합니다.'});
          break;
        }
        var newCentroids = centroids.map(function(c, ci){
          var members = points.filter(function(p, pi){ return assignments[pi] === ci; });
          if(members.length === 0) return c;
          var sx = 0, sy = 0;
          members.forEach(function(p){ sx += p.x; sy += p.y; });
          return {x: sx / members.length, y: sy / members.length};
        });
        centroids = newCentroids;
        steps.push({assignments: assignments.slice(), centroids: cloneCentroids(centroids), log: iter + '번째 반복: 각 군집에 속한 데이터의 평균 위치로 중심점을 이동합니다.'});
        prevAssignments = assignments;
        if(iter === maxIter){
          steps.push({assignments: assignments.slice(), centroids: cloneCentroids(centroids), log: '✅ 최대 반복 횟수에 도달하여 알고리즘을 종료합니다.'});
        }
      }
      return steps;
    }

    var kmSvg = document.getElementById('kmSvg');
    var kmLog = document.getElementById('kmLog');
    var kmStepNum = document.getElementById('kmStepNum');
    var kmStepTotal = document.getElementById('kmStepTotal');
    var kmNextBtn = document.getElementById('kmNextBtn');
    var kmResetBtn = document.getElementById('kmResetBtn');
    var kmSteps = [];
    var kmStepIdx = 0;

    function renderKM(){
      var step = kmSteps[kmStepIdx];
      kmSvg.innerHTML = '';
      KM_POINTS.forEach(function(p, i){
        var ci = step.assignments[i];
        var cls = 'km-point ' + (ci === -1 ? 'unassigned' : ('c' + ci));
        kmSvg.appendChild(svgEl('circle', {cx:p.x, cy:p.y, r:6, class:cls}));
      });
      step.centroids.forEach(function(c, ci){
        kmSvg.appendChild(svgEl('circle', {cx:c.x, cy:c.y, r:11, class:'km-centroid c' + ci}));
        kmSvg.appendChild(svgEl('text', {x:c.x, y:c.y + 4, 'text-anchor':'middle', 'font-size':11, 'font-weight':800, fill:'#fff', 'pointer-events':'none'}, String(ci + 1)));
      });
      kmLog.textContent = step.log;
      kmStepNum.textContent = kmStepIdx + 1;
      kmStepTotal.textContent = kmSteps.length;
      var atEnd = kmStepIdx >= kmSteps.length - 1;
      kmNextBtn.textContent = atEnd ? '완료 ✓' : '다음 단계 ▶';
      kmNextBtn.disabled = atEnd;
    }
    function resetKM(){
      kmSteps = genKMeans(KM_POINTS, INIT_CENTROIDS, 8);
      kmStepIdx = 0;
      renderKM();
    }
    kmNextBtn.addEventListener('click', function(){ if(kmStepIdx < kmSteps.length - 1){ kmStepIdx++; renderKM(); } });
    kmResetBtn.addEventListener('click', resetKM);
    resetKM();
  })();

      }
      pts.forEach(function(p, i){
        var cls = 'ml-point ' + (p.c === 'A' ? 'classA' : 'classB');
        svg.appendChild(svgEl('circle', {cx:p.x, cy:p.y, r: neighborIdxs.indexOf(i) >= 0 ? 8 : 6, class: cls}));
      });
      if(k > 0){
        var maxD = 0;
        neighborIdxs.forEach(function(i){
          var p = pts[i];
          var dx = p.x - testPoint.x, dy = p.y - testPoint.y;
          var d = Math.sqrt(dx*dx + dy*dy);
          if(d > maxD) maxD = d;
        });
        svg.appendChild(svgEl('circle', {cx:testPoint.x, cy:testPoint.y, r:maxD, class:'ml-neighbor-circle'}));
      }
      svg.appendChild(svgEl('circle', {cx:testPoint.x, cy:testPoint.y, r:9, class:'ml-point test'}));
      svg.appendChild(svgEl('text', {x:testPoint.x, y:testPoint.y - 14, 'text-anchor':'middle', class:'ml-hint-text'}, '?'));

      var totalA = pts.filter(function(p){ return p.c === 'A'; }).length;
      var totalB = pts.filter(function(p){ return p.c === 'B'; }).length;
      if(totalA < 1 || totalB < 1){
        resultBox.textContent = '클래스 A와 클래스 B를 각각 최소 1개 이상 추가해 보세요. (현재 A ' + totalA + '개, B ' + totalB + '개)';
      } else {
        var countA = neighborIdxs.filter(function(i){ return pts[i].c === 'A'; }).length;
        var countB = neighborIdxs.length - countA;
        var predicted = countA >= countB ? 'A' : 'B';
        resultBox.textContent = 'k = ' + k + '일 때 가장 가까운 이웃 중 클래스 A ' + countA + '개, 클래스 B ' + countB + '개 → 가운데(？) 데이터는 클래스 ' + predicted + '(으)로 분류됩니다!';
      }
    }

    modeButtons.forEach(function(btn){
      btn.addEventListener('click', function(){
        modeButtons.forEach(function(b){ b.classList.toggle('active', b === btn); });
        currentMode = btn.dataset.cls;
      });
    });
    svg.addEventListener('click', function(e){
      var svgP = svgClickToPoint(svg, e);
      pts.push({x: svgP.x, y: svgP.y, c: currentMode});
      render();
    });
    resetBtn.addEventListener('click', function(){ pts = []; render(); });
    render();
  })();

  /* ================= slide 19 : quiz ================= */
  var quizData = [
    {q:'입력과 출력(정답) 쌍으로 이루어진 훈련 데이터를 이용해 입력과 출력 사이의 관계를 학습하는 기계 학습 방식은?', choices:['지도 학습','비지도 학습','강화 학습','딥러닝'], a:0, ex:'지도 학습은 입력과 출력(정답) 쌍으로 이루어진 훈련 데이터를 사용해 학습하며, 로지스틱 회귀·결정 트리·k-NN 등이 대표적인 알고리즘이다.'},
    {q:'에이전트가 환경과 상호작용하며 보상을 최대화하는 방향으로 행동을 학습하는 기계 학습 방식은?', choices:['지도 학습','비지도 학습','강화 학습','분류'], a:2, ex:'강화 학습은 에이전트가 환경과 상호작용하며 보상을 최대화하는 행동을 스스로 학습하는 방식으로, Q-Learning·DQN 등이 대표적이다.'},
    {q:'새로운 데이터와 거리상 가장 가까운 k개의 이웃을 찾아 다수결로 클래스를 정하는 분류 알고리즘은?', choices:['로지스틱 회귀','결정 트리','k-최근접 이웃(k-NN)','k-평균'], a:2, ex:'k-최근접 이웃(k-NN)은 새로운 데이터와 거리가 가까운 k개의 이웃 데이터를 찾아 다수결로 클래스를 정하는 분류 알고리즘이다.'},
    {q:'로지스틱 회귀에서 선형 함수의 결과를 0과 1 사이의 확률값으로 변환하기 위해 사용하는 함수는?', choices:['시그모이드 함수','해시 함수','거리 함수','활성화 임곗값 함수'], a:0, ex:'로지스틱 회귀는 선형 함수의 결과를 시그모이드 함수 S(x) = 1/(1+e⁻ˣ)에 통과시켜 0~1 사이의 확률값으로 변환한다.'},
    {q:'초기 중심점 설정 → 군집 할당 → 중심점 업데이트 → 재할당의 과정을 반복하며 데이터를 k개의 군집으로 나누는 군집화 알고리즘은?', choices:['DBSCAN','계층적 군집화','k-평균','k-최근접 이웃'], a:2, ex:'k-평균(k-means)은 초기 중심점을 설정한 뒤, 군집 할당과 중심점 업데이트를 반복하여 데이터를 k개의 군집으로 나누는 알고리즘이다.'},
    {q:'군집 개수를 미리 정하지 않아도 되며, 데이터의 밀도를 기준으로 군집을 형성하고 노이즈를 구분할 수 있는 군집화 알고리즘은?', choices:['k-평균','DBSCAN','로지스틱 회귀','서포트 벡터 머신'], a:1, ex:'DBSCAN은 밀도 기반으로 군집을 형성하는 알고리즘으로, 군집 개수를 미리 지정할 필요가 없고 노이즈가 포함된 데이터도 구분할 수 있다.'}
  ];
  var qIdx = 0, qScore = 0, qAnswered = false;
  var quizScenario = document.getElementById('quizScenario');
  var quizChoices = document.getElementById('quizChoices');
  var quizFeedback = document.getElementById('quizFeedback');
  var quizNextBtn = document.getElementById('quizNext');
  var quizActive = document.getElementById('quizActive');
  var quizSummary = document.getElementById('quizSummary');
  function renderQuiz(){
    quizActive.style.display = 'flex';
    quizSummary.classList.remove('active');
    document.getElementById('quizProgress').textContent = (qIdx+1)+' / '+quizData.length;
    document.getElementById('quizScore').textContent = '점수 '+qScore;
    var item = quizData[qIdx];
    quizScenario.textContent = item.q;
    quizChoices.innerHTML = '';
    qAnswered = false;
    quizFeedback.classList.add('hidden');
    quizFeedback.textContent = '';
    quizNextBtn.disabled = true;
    item.choices.forEach(function(label, ci){
      var btn = document.createElement('button');
      btn.className = 'quiz-choice';
      btn.textContent = label;
      btn.addEventListener('click', function(){
        if(qAnswered) return;
        qAnswered = true;
        var isCorrect = ci === item.a;
        Array.prototype.forEach.call(quizChoices.children, function(b,bi){
          b.disabled = true;
          if(bi === item.a) b.classList.add('correct');
        });
        if(!isCorrect) btn.classList.add('wrong');
        if(isCorrect) qScore++;
        document.getElementById('quizScore').textContent = '점수 '+qScore;
        quizFeedback.classList.remove('hidden');
        quizFeedback.textContent = (isCorrect? '✅ 정답! ' : '❌ 오답. ') + item.ex;
        quizNextBtn.disabled = false;
      });
      quizChoices.appendChild(btn);
    });
  }
  quizNextBtn.addEventListener('click', function(){
    qIdx++;
    if(qIdx >= quizData.length){
      quizActive.style.display = 'none';
      quizSummary.classList.add('active');
      document.getElementById('quizFinalScore').textContent = qScore+' / '+quizData.length;
    } else { renderQuiz(); }
  });
  document.getElementById('quizRetry').addEventListener('click', function(){ qIdx = 0; qScore = 0; renderQuiz(); });
  renderQuiz();


  }

})();
</script>
<script>
(function(){
  var canvasTop = document.getElementById('annotCanvas'); /* 상호작용 + 실시간 미리보기 */
  var canvasInk = document.getElementById('annotInk');    /* 실제로 확정되어 남는 필기 */
  if(!canvasTop || !canvasInk) return;
  var ctx = canvasTop.getContext('2d');
  var ink = canvasInk.getContext('2d');
  var btnSelect = document.getElementById('atSelect');
  var btnPen = document.getElementById('atPen');
  var btnHi = document.getElementById('atHi');
  var btnEraser = document.getElementById('atEraser');
  var btnClear = document.getElementById('atClear');
  var thickWrap = document.getElementById('annotThickWrap');
  var thickRange = document.getElementById('annotThickRange');
  var thickVal = document.getElementById('annotThickVal');
  var tool = null; /* 'pen' | 'hi' | 'eraser' | null */
  var drawing = false;
  var hiPoints = null; /* 형광펜 획이 진행되는 동안의 좌표 누적 (겹침에 의한 불투명도 누적을 막기 위함) */

  /* 도구별 굵기(px) 및 조절 가능 범위 */
  var widths = { pen: 3, hi: 22, eraser: 34 };
  var ranges = {
    pen:    { min: 1,  max: 16, step: 0.5 },
    hi:     { min: 6,  max: 50, step: 1 },
    eraser: { min: 10, max: 90, step: 1 }
  };
  var HI_ALPHA = 0.3;

  function resizeCanvas(){
    var dpr = window.devicePixelRatio || 1;
    [[canvasTop, ctx], [canvasInk, ink]].forEach(function(pair){
      var c = pair[0], cx = pair[1];
      c.width = Math.max(1, Math.floor(window.innerWidth * dpr));
      c.height = Math.max(1, Math.floor(window.innerHeight * dpr));
      c.style.width = window.innerWidth + 'px';
      c.style.height = window.innerHeight + 'px';
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });
  }
  function clearLayer(cx, c){
    cx.save();
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.clearRect(0, 0, c.width, c.height);
    cx.restore();
  }
  function clearCanvas(){
    clearLayer(ctx, canvasTop);
    clearLayer(ink, canvasInk);
  }
  resizeCanvas();

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 120);
  });

  function fmtWidth(v){
    v = Math.round(v * 10) / 10;
    return String(v);
  }

  function updateThicknessUI(){
    if(!thickWrap || !thickRange || !thickVal) return;
    if(tool === 'pen' || tool === 'hi' || tool === 'eraser'){
      var r = ranges[tool];
      thickRange.min = r.min;
      thickRange.max = r.max;
      thickRange.step = r.step;
      thickRange.value = widths[tool];
      thickVal.textContent = fmtWidth(widths[tool]);
      thickWrap.classList.add('show');
    } else {
      thickWrap.classList.remove('show');
    }
  }

  function setTool(t){
    tool = t;
    canvasTop.style.pointerEvents = t ? 'auto' : 'none';
    [btnSelect, btnPen, btnHi, btnEraser].forEach(function(b){ if(b) b.classList.remove('active'); });
    var active = t === 'pen' ? btnPen : t === 'hi' ? btnHi : t === 'eraser' ? btnEraser : btnSelect;
    if(active) active.classList.add('active');
    updateThicknessUI();
  }
  function toggleTool(t){ setTool(tool === t ? null : t); }

  if(btnSelect) btnSelect.addEventListener('click', function(){ setTool(null); });
  if(btnPen) btnPen.addEventListener('click', function(){ toggleTool('pen'); });
  if(btnHi) btnHi.addEventListener('click', function(){ toggleTool('hi'); });
  if(btnEraser) btnEraser.addEventListener('click', function(){ toggleTool('eraser'); });
  if(btnClear) btnClear.addEventListener('click', clearCanvas);
  setTool(null);

  if(thickRange){
    thickRange.addEventListener('input', function(){
      if(tool === 'pen' || tool === 'hi' || tool === 'eraser'){
        widths[tool] = parseFloat(thickRange.value);
        thickVal.textContent = fmtWidth(widths[tool]);
      }
    });
  }

  /* 펜 / 지우개: 알파값이 1이라 겹쳐 그려도 문제가 없으므로 바로 ink 레이어에 그린다 */
  function beginInkStroke(x, y){
    ink.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    ink.strokeStyle = '#ef4444';
    ink.globalAlpha = 1;
    ink.lineWidth = widths[tool];
    ink.lineCap = 'round';
    ink.lineJoin = 'round';
    ink.beginPath();
    ink.moveTo(x, y);
  }

  /* 형광펜: 반투명이라 매 구간을 따로 그리면 겹치는 부분의 불투명도가 누적돼 진해진다.
     그래서 진행 중인 전체 경로를 매 프레임 top 레이어에 "한 번의 stroke 호출"로 다시 그리고,
     손을 뗄 때만 결과 비트맵을 ink 레이어로 한 번에 합성한다. */
  function drawHiPreview(){
    clearLayer(ctx, canvasTop);
    if(!hiPoints || hiPoints.length < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = HI_ALPHA;
    ctx.strokeStyle = '#ffd400';
    ctx.lineWidth = widths.hi;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(hiPoints[0].x, hiPoints[0].y);
    for(var i = 1; i < hiPoints.length; i++){ ctx.lineTo(hiPoints[i].x, hiPoints[i].y); }
    ctx.stroke();
    ctx.restore();
  }

  canvasTop.addEventListener('pointerdown', function(e){
    if(!tool) return;
    drawing = true;
    if(tool === 'hi'){
      hiPoints = [{ x: e.clientX, y: e.clientY }];
      drawHiPreview();
    } else {
      beginInkStroke(e.clientX, e.clientY);
    }
    try{ canvasTop.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  canvasTop.addEventListener('pointermove', function(e){
    if(!drawing || !tool) return;
    if(tool === 'hi'){
      hiPoints.push({ x: e.clientX, y: e.clientY });
      drawHiPreview();
    } else {
      ink.lineTo(e.clientX, e.clientY);
      ink.stroke();
      ink.beginPath();
      ink.moveTo(e.clientX, e.clientY);
    }
  });
  function endStroke(){
    if(drawing && tool === 'hi' && hiPoints && hiPoints.length >= 2){
      ink.save();
      ink.setTransform(1, 0, 0, 1, 0, 0);
      ink.globalCompositeOperation = 'source-over';
      ink.globalAlpha = 1;
      ink.drawImage(canvasTop, 0, 0);
      ink.restore();
    }
    drawing = false;
    hiPoints = null;
    clearLayer(ctx, canvasTop);
  }
  canvasTop.addEventListener('pointerup', endStroke);
  canvasTop.addEventListener('pointercancel', endStroke);
  canvasTop.addEventListener('pointerleave', endStroke);

  /* 단축키: Ctrl+1 선택 · Ctrl+2 펜 · Ctrl+3 형광펜 · Ctrl+4 지우개 · Ctrl+5 전체 지우기 */
  window.addEventListener('keydown', function(e){
    if(!e.ctrlKey || e.altKey || e.metaKey) return;
    var tg = e.target;
    if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) return;
    switch(e.key){
      case '1': e.preventDefault(); setTool(null); break;
      case '2': e.preventDefault(); toggleTool('pen'); break;
      case '3': e.preventDefault(); toggleTool('hi'); break;
      case '4': e.preventDefault(); toggleTool('eraser'); break;
      case '5': e.preventDefault(); clearCanvas(); break;
    }
  });

  /* 슬라이드가 바뀌면 이전 필기를 자동으로 지운다 (슬라이드 번호 표시가 바뀔 때만 반응) */
  var counterEl = document.getElementById('counter');
  if(counterEl){
    var lastCounterText = counterEl.textContent;
    var co = new MutationObserver(function(){
      if(counterEl.textContent !== lastCounterText){
        lastCounterText = counterEl.textContent;
        clearCanvas();
      }
    });
    co.observe(counterEl, { characterData:true, childList:true, subtree:true });
  }
})();
</script>
