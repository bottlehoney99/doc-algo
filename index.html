<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정보 교과서 인터랙티브 수업 자료 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#e9eef6; --bg-grid:#d7e0ef;
    --surface:#ffffff; --surface-2:#eef2f9; --surface-3:#e4eaf4;
    --ink:#0e1626; --ink-soft:#48536b; --ink-faint:#8592ab;
    --accent:#2456d6; --accent-ink:#ffffff; --accent-soft:#dde6fc;
    --teal:#0ea89a; --teal-soft:#d9f2ee;
    --amber:#c97418; --amber-soft:#faead2;
    --danger:#c23c50; --danger-soft:#fbe2e6;
    --violet:#7451d6; --violet-soft:#e7e0fb;
    --border:rgba(14,22,38,.12); --border-soft:rgba(14,22,38,.07);
    --code-bg:#0c1730; --code-ink:#dbe6fb; --code-faint:#7489b3;
    --code-kw:#7fb0ff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
    --shadow: 0 24px 55px -28px rgba(14,22,38,.4);
    --shadow-sm: 0 8px 20px -12px rgba(14,22,38,.3);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a1120; --bg-grid:#0f1a30;
      --surface:#121b30; --surface-2:#182440; --surface-3:#1c2c4d;
      --ink:#edf1fb; --ink-soft:#aeb9d4; --ink-faint:#77839f;
      --accent:#6d97f5; --accent-ink:#081026; --accent-soft:#1c2c50;
      --teal:#3fd2c0; --teal-soft:#123832;
      --amber:#f0ab5c; --amber-soft:#3a2a12;
      --danger:#ea8090; --danger-soft:#3a1620;
      --violet:#a58aef; --violet-soft:#2a2350;
      --border:rgba(237,241,251,.14); --border-soft:rgba(237,241,251,.08);
      --code-bg:#060c1a; --code-ink:#dbe6fb; --code-faint:#6d80a8;
      --code-kw:#8fbaff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
      --shadow: 0 24px 55px -28px rgba(0,0,0,.65);
      --shadow-sm: 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1120; --bg-grid:#0f1a30;
    --surface:#121b30; --surface-2:#182440; --surface-3:#1c2c4d;
    --ink:#edf1fb; --ink-soft:#aeb9d4; --ink-faint:#77839f;
    --accent:#6d97f5; --accent-ink:#081026; --accent-soft:#1c2c50;
    --teal:#3fd2c0; --teal-soft:#123832;
    --amber:#f0ab5c; --amber-soft:#3a2a12;
    --danger:#ea8090; --danger-soft:#3a1620;
    --violet:#a58aef; --violet-soft:#2a2350;
    --border:rgba(237,241,251,.14); --border-soft:rgba(237,241,251,.08);
    --code-bg:#060c1a; --code-ink:#dbe6fb; --code-faint:#6d80a8;
    --code-kw:#8fbaff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
    --shadow: 0 24px 55px -28px rgba(0,0,0,.65);
    --shadow-sm: 0 8px 20px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color:var(--ink);
    font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:28px 16px 118px;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  h1,h2,h3,p{margin:0;}
  button,input,textarea{font-family:inherit;}

  #deck-stage{width:100%;max-width:1180px;display:flex;justify-content:center;}
  .slide{
    display:none;width:100%;aspect-ratio:16/9;background:var(--surface);
    border:1px solid var(--border-soft);border-radius:22px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;flex-direction:column;
  }
  .slide.active{display:flex;animation:rise .38s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.slide.active{animation:none;}}

  .slide-inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 52px 24px;overflow-y:auto;min-height:0;}
  .slide-inner::-webkit-scrollbar{width:8px;}
  .slide-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 52px 0;flex:none;}
  .breadcrumb{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
  .breadcrumb .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-faint);}
  .kind-tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;text-transform:uppercase;}

  .kicker{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;display:block;}
  .h1{font-weight:900;font-size:clamp(21px,2.3vw,30px);line-height:1.25;text-wrap:balance;color:var(--ink);margin-bottom:12px;}
  .lead{font-size:16px;line-height:1.68;color:var(--ink-soft);max-width:68ch;}
  .lead b{color:var(--ink);font-weight:800;}

  .slide[data-kind="title"] .slide-inner,.slide[data-kind="divider"] .slide-inner{justify-content:center;padding:34px 64px;position:relative;}
  .chip-icon{position:absolute;top:30px;right:40px;width:70px;height:70px;opacity:.5;}
  .big-num{font-family:"Black Han Sans",sans-serif;font-size:clamp(58px,9vw,116px);line-height:.85;color:var(--accent);}
  .title-block .h1{font-size:clamp(27px,3.4vw,40px);margin:6px 0 15px;}
  .subject-eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .goal-list{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:60ch;}
  .goal-item{display:flex;gap:11px;align-items:flex-start;font-size:15.2px;color:var(--ink-soft);line-height:1.6;}
  .goal-item .mark{flex:none;width:21px;height:21px;border-radius:7px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-top:1px;}
  .linkage-pill{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:11.6px;color:var(--ink-faint);border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-weight:600;max-width:fit-content;}
  .linkage-pill b{color:var(--ink-soft);font-weight:800;}
  .interactive-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);padding:4px 10px;border-radius:999px;margin-top:12px;letter-spacing:.02em;}
  .divider-wrap{display:flex;align-items:center;gap:30px;}
  .divider-sub{font-size:15.8px;color:var(--ink-soft);line-height:1.7;max-width:44ch;border-left:3px solid var(--accent);padding-left:16px;}

  .card-grid{display:grid;gap:13px;flex:1;min-height:0;align-content:center;}
  .cols-2{grid-template-columns:1fr 1fr;} .cols-3{grid-template-columns:repeat(3,1fr);} .cols-4{grid-template-columns:repeat(4,1fr);}
  .card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:13px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
  .card .num{font-family:"Black Han Sans",sans-serif;font-size:18px;color:var(--accent);}
  .card h3{font-size:14.6px;font-weight:800;color:var(--ink);}
  .card p{font-size:13.6px;line-height:1.56;color:var(--ink-soft);}

  .pipeline{display:flex;align-items:center;gap:0;flex:1;min-height:0;}
  .pipe-step{flex:1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:13px;padding:13px 11px;display:flex;flex-direction:column;gap:5px;}
  .pipe-step .pn{font-family:"Black Han Sans",sans-serif;font-size:18px;color:var(--accent);}
  .pipe-step h3{font-size:13.4px;font-weight:800;} .pipe-step p{font-size:12.2px;color:var(--ink-soft);line-height:1.45;}
  .pipe-arrow{flex:none;width:20px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:15px;}

  .table-wrap{overflow-x:auto;flex:1;}
  table.modeling{width:100%;border-collapse:collapse;font-size:13.8px;}
  table.modeling th,table.modeling td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;}
  table.modeling thead th{background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.4px;}
  table.modeling td{color:var(--ink-soft);line-height:1.5;}
  table.modeling td.strong{color:var(--ink);font-weight:700;}
  code.inline{font-family:"JetBrains Mono",monospace;background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:11.6px;color:var(--ink);}

  .code-block{flex:1;background:var(--code-bg);border-radius:13px;padding:15px 17px;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:12.8px;line-height:1.62;color:var(--code-ink);box-shadow:var(--shadow-sm);}
  .code-block .ln{color:var(--code-faint);display:inline-block;width:18px;text-align:right;margin-right:12px;user-select:none;}
  .kw{color:var(--code-kw);} .str{color:var(--code-str);} .num{color:var(--code-num);} .cm{color:var(--code-cm);}
  .cline{display:block;padding:1px 6px;border-radius:5px;transition:background .2s;}
  .cline.active{background:rgba(109,151,245,.28);}
  .code-note-row{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap;}
  .code-note{font-size:11.4px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-radius:9px;padding:7px 11px;border:1px solid var(--border-soft);}
  .code-note b{color:var(--accent);}

  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;align-content:center;}
  .compare-card{border-radius:15px;padding:16px 18px;display:flex;flex-direction:column;gap:9px;border:1px solid transparent;}
  .compare-card.good{background:var(--teal-soft);border-color:color-mix(in srgb, var(--teal) 30%, transparent);}
  .compare-card.bad{background:var(--danger-soft);border-color:color-mix(in srgb, var(--danger) 30%, transparent);}
  .compare-head{display:flex;align-items:center;gap:7px;font-weight:900;font-size:13px;}
  .compare-card.good .compare-head{color:var(--teal);} .compare-card.bad .compare-head{color:var(--danger);}
  .compare-caption{font-size:13px;color:var(--ink-soft);line-height:1.55;}
  .trait-list{display:flex;flex-wrap:wrap;gap:7px;}
  .trait{font-size:11.6px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);}
  .compare-card.bad .trait.flag{background:var(--danger);color:#fff;border-color:transparent;}
  .insight-strip{display:flex;gap:9px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:10px 15px;font-size:13.4px;font-weight:700;}
  .reading-card{flex:1;background:var(--surface-2);border-radius:15px;padding:20px 22px;display:flex;flex-direction:column;gap:11px;justify-content:center;border:1px solid var(--border-soft);}
  .reading-card .lead{max-width:none;font-size:14.6px;}
  .term-chip{font-size:11.8px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);padding:6px 11px;border-radius:999px;}
  .term-chip b{color:var(--accent);}
  .reading-tagrow{display:flex;gap:7px;flex-wrap:wrap;}

  /* ===== buttons ===== */
  .sim-btn{flex:none;appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:12.4px;padding:9px 16px;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .sim-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .sim-btn:disabled{opacity:.4;cursor:not-allowed;}
  .sim-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .sim-btn.primary:hover{filter:brightness(1.08);}
  .ctrl-row{display:flex;gap:8px;}
  .ctrl-row .sim-btn{flex:1;}

  /* ===== interactive: generic chip ===== */
  .chip{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink-soft);font-weight:700;font-size:13.8px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .chip.ok{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .chip.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .chip.missed{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);border-style:dashed;}
  .chip-pool{display:flex;flex-wrap:wrap;gap:9px;}

  /* ===== interactive: 생각열기 클러터 정리 ===== */
  .clutter-field{position:relative;background:var(--surface-2);border-radius:16px;border:1px dashed var(--border);min-height:150px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;padding:20px;}
  .clutter-tag{font-size:14.2px;font-weight:700;padding:9px 15px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s;user-select:none;}
  .clutter-tag:hover{border-color:var(--accent);}
  .clutter-tag.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);text-decoration:line-through;opacity:.7;transform:scale(.94);}
  .clutter-progress{font-size:12.6px;font-weight:800;color:var(--ink-faint);text-align:center;}

  /* ===== 지저분한 방 청소 : 그림 활동 ===== */
  .rm-wrap{display:flex;flex-direction:column;gap:8px;}
  .rm-scene{width:100%;height:auto;display:block;border-radius:16px;border:1px solid var(--border-soft);touch-action:none;user-select:none;-webkit-user-select:none;}
  .rm-wall{fill:var(--surface-2);} .rm-floor{fill:var(--surface-3);} .rm-base{stroke:var(--border);stroke-width:3;}
  .rm-plank{stroke:var(--border-soft);stroke-width:2;}
  .rm-wood{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2.2;stroke-linejoin:round;}
  .rm-line{stroke:var(--amber);stroke-width:2;fill:none;stroke-linecap:round;}
  .rm-ink{fill:var(--ink-soft);} .rm-screen{fill:var(--accent-soft);}
  .rm-out{stroke:var(--ink-soft);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .rm-c1{fill:var(--accent);} .rm-c2{fill:var(--teal);} .rm-c3{fill:var(--amber);} .rm-c4{fill:var(--danger);} .rm-c5{fill:var(--violet);} .rm-cs{fill:var(--surface);}
  .rm-lbl{font-size:15px;font-weight:800;fill:var(--ink-soft);text-anchor:middle;}
  .rm-dest{cursor:pointer;outline:none;}
  .rm-dest .rm-hit{fill:transparent;stroke:transparent;stroke-width:2.5;stroke-dasharray:7 6;rx:14;}
  .rm-dest:hover .rm-hit,.rm-dest:focus-visible .rm-hit{stroke:var(--accent);}
  .rm-dest.over .rm-hit{fill:var(--accent-soft);fill-opacity:.55;stroke:var(--accent);}
  .rm-dest.hintable .rm-hit{stroke:var(--accent);stroke-opacity:.45;}
  .rm-dest .rm-shake{transform-box:fill-box;transform-origin:center;}
  .rm-dest.wrong .rm-shake{animation:rmShake .4s;}
  @keyframes rmShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .rm-badge{opacity:0;transition:opacity .3s;}
  .rm-dest.filled .rm-badge{opacity:1;}
  .rm-badge circle{fill:var(--teal);} .rm-badge path{stroke:var(--surface);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .rm-item{cursor:grab;outline:none;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .4s;transform-box:view-box;transform-origin:0 0;}
  .rm-item.drag{transition:none;cursor:grabbing;}
  .rm-item .rm-ring{fill:var(--surface);fill-opacity:.85;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5;opacity:0;transition:opacity .2s;}
  .rm-item.sel .rm-ring,.rm-item:focus-visible .rm-ring{opacity:1;}
  .rm-item .rm-itxt{font-size:13px;font-weight:800;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;}
  .rm-item.gone{opacity:0;pointer-events:none;}
  .rm-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .rm-hint{font-size:13.4px;font-weight:700;color:var(--ink-soft);min-height:20px;}
  .rm-hint.ok{color:var(--teal);} .rm-hint.bad{color:var(--danger);}
  .rm-bar .clutter-progress{margin:0;}
  @media (prefers-reduced-motion: reduce){.rm-item{transition:none;}.rm-dest.wrong .rm-shake{animation:none;}}

  /* ===== 지저분한 방 청소 v2 : 두 가지 방법 비교 ===== */
  .rm2-stage{position:relative;}
  .rm-item2{cursor:pointer;outline:none;transition:opacity .25s;}
  .rm-item2 .rm-ring{fill:var(--surface);fill-opacity:.7;stroke:var(--accent);stroke-width:4;stroke-dasharray:7 6;opacity:0;transition:opacity .15s;}
  .rm-item2:hover .rm-ring,.rm-item2:focus-visible .rm-ring{opacity:1;}
  .rm-item2.gone{opacity:0;pointer-events:none;}
  .rm2-locked .rm-item2{cursor:default;}
  .rm2-locked .rm-item2 .rm-ring{opacity:0!important;}
  .rm-trail{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.55;}
  .rm-trail.r1{stroke:var(--danger);} .rm-trail.r2{stroke:var(--teal);opacity:.75;}
  .rm-person .body{fill:var(--accent);} .rm-person .head{fill:var(--amber-soft);stroke:var(--ink-soft);stroke-width:2;}
  .rm-person .carry{opacity:0;transition:opacity .2s;} .rm-person.carrying .carry{opacity:1;}
  .rm-person .carry circle{fill:var(--amber);} .rm-person .carry text{fill:#fff;font-size:15px;font-weight:900;text-anchor:middle;}
  .rm-cnt{opacity:0;transition:opacity .2s;} .rm-cnt.on{opacity:1;}
  .rm-cnt circle{fill:var(--teal);} .rm-cnt text{fill:#fff;font-size:17px;font-weight:900;text-anchor:middle;}
  .rm2-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .rm2-steps{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800;}
  .rm2-step{appearance:none;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--border-soft);}
  .rm2-step.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .rm2-step.done{background:var(--teal-soft);color:var(--teal);border-color:transparent;}
  .rm2-meter{display:flex;gap:8px;margin-left:auto;}
  .rm2-meter span{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:800;color:var(--ink);background:var(--surface-2);border-radius:9px;padding:6px 11px;font-variant-numeric:tabular-nums;}
  .rm2-meter b{color:var(--ink-faint);font-family:"Gothic A1",sans-serif;font-size:11.5px;margin-right:5px;}
  .rm2-cats{display:flex;gap:7px;flex-wrap:wrap;}
  .rm2-cat{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:12.6px;padding:6px 11px;border-radius:999px;cursor:pointer;}
  .rm2-cat:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .rm2-cat:disabled{opacity:.4;cursor:default;text-decoration:line-through;}
  .rm2-cat svg{width:22px;height:22px;}
  .rm2-hint{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .rm2-compare{position:absolute;inset:0;background:var(--surface);border-radius:16px;border:1px solid var(--border-soft);display:none;grid-template-columns:1fr 1fr;gap:14px;padding:12px;align-content:center;}
  .rm2-compare.on{display:grid;animation:rise .4s;}
  .rm2-col{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .rm2-col svg{width:100%;height:auto;border-radius:10px;border:1px solid var(--border-soft);}

  /* ===== 클래스 · 객체 · 속성 · 메서드 ===== */

  /* ===== interactive: 문장 선택형 (불필요한 정보 고르기) ===== */

  }
  @media print{
    body{padding:0;background:#fff;}
    #controls,.progress-rail,#toc-overlay{display:none!important;}
    .slide{display:flex!important;aspect-ratio:auto;height:100vh;box-shadow:none;border-radius:0;page-break-after:always;margin:0 auto;}
  }
  :root{
    --bg:#e9eef6; --bg-grid:#d7e0ef;
    --surface:#ffffff; --surface-2:#eef2f9; --surface-3:#e4eaf4;
    --ink:#0e1626; --ink-soft:#48536b; --ink-faint:#8592ab;
    --accent:#2456d6; --accent-ink:#ffffff; --accent-soft:#dde6fc;
    --teal:#0ea89a; --teal-soft:#d9f2ee;
    --amber:#c97418; --amber-soft:#faead2;
    --danger:#c23c50; --danger-soft:#fbe2e6;
    --violet:#7451d6; --violet-soft:#e7e0fb;
    --border:rgba(14,22,38,.12); --border-soft:rgba(14,22,38,.07);
    --code-bg:#0c1730; --code-ink:#dbe6fb; --code-faint:#7489b3;
    --code-kw:#7fb0ff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
    --shadow: 0 24px 55px -28px rgba(14,22,38,.4);
    --shadow-sm: 0 8px 20px -12px rgba(14,22,38,.3);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a1120; --bg-grid:#0f1a30;
      --surface:#121b30; --surface-2:#182440; --surface-3:#1c2c4d;
      --ink:#edf1fb; --ink-soft:#aeb9d4; --ink-faint:#77839f;
      --accent:#6d97f5; --accent-ink:#081026; --accent-soft:#1c2c50;
      --teal:#3fd2c0; --teal-soft:#123832;
      --amber:#f0ab5c; --amber-soft:#3a2a12;
      --danger:#ea8090; --danger-soft:#3a1620;
      --violet:#a58aef; --violet-soft:#2a2350;
      --border:rgba(237,241,251,.14); --border-soft:rgba(237,241,251,.08);
      --code-bg:#060c1a; --code-ink:#dbe6fb; --code-faint:#6d80a8;
      --code-kw:#8fbaff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
      --shadow: 0 24px 55px -28px rgba(0,0,0,.65);
      --shadow-sm: 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1120; --bg-grid:#0f1a30;
    --surface:#121b30; --surface-2:#182440; --surface-3:#1c2c4d;
    --ink:#edf1fb; --ink-soft:#aeb9d4; --ink-faint:#77839f;
    --accent:#6d97f5; --accent-ink:#081026; --accent-soft:#1c2c50;
    --teal:#3fd2c0; --teal-soft:#123832;
    --amber:#f0ab5c; --amber-soft:#3a2a12;
    --danger:#ea8090; --danger-soft:#3a1620;
    --violet:#a58aef; --violet-soft:#2a2350;
    --border:rgba(237,241,251,.14); --border-soft:rgba(237,241,251,.08);
    --code-bg:#060c1a; --code-ink:#dbe6fb; --code-faint:#6d80a8;
    --code-kw:#8fbaff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
    --shadow: 0 24px 55px -28px rgba(0,0,0,.65);
    --shadow-sm: 0 8px 20px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color:var(--ink);
    font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:28px 16px 118px;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}

  #deck-stage{width:100%;max-width:1180px;display:flex;justify-content:center;}
  .slide{
    display:none;width:100%;aspect-ratio:16/9;background:var(--surface);
    border:1px solid var(--border-soft);border-radius:22px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;flex-direction:column;
  }
  .slide.active{display:flex;animation:rise .38s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.slide.active{animation:none;}}

  .slide-inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 54px 26px;overflow-y:auto;min-height:0;}
  .slide-inner::-webkit-scrollbar{width:8px;}
  .slide-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 54px 0;flex:none;}
  .breadcrumb{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
  .breadcrumb .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-faint);}
  .kind-tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;text-transform:uppercase;}

  .kicker{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;display:block;}
  .h1{font-weight:900;font-size:clamp(22px,2.4vw,31px);line-height:1.25;text-wrap:balance;color:var(--ink);margin-bottom:14px;}
  .lead{font-size:14.8px;line-height:1.7;color:var(--ink-soft);max-width:66ch;}
  .lead b{color:var(--ink);font-weight:800;}

  /* title / divider */
  .slide[data-kind="title"] .slide-inner,.slide[data-kind="divider"] .slide-inner{justify-content:center;padding:34px 64px;position:relative;}
  .chip-icon{position:absolute;top:30px;right:40px;width:70px;height:70px;opacity:.5;}
  .big-num{font-family:"Black Han Sans",sans-serif;font-size:clamp(58px,9vw,116px);line-height:.85;color:var(--accent);}
  .title-block .h1{font-size:clamp(28px,3.6vw,42px);margin:6px 0 16px;}
  .subject-eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .goal-list{display:flex;flex-direction:column;gap:9px;margin-top:18px;max-width:60ch;}
  .goal-item{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;color:var(--ink-soft);line-height:1.6;}
  .goal-item .mark{flex:none;width:21px;height:21px;border-radius:7px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-top:1px;}
  .linkage-pill{margin-top:20px;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-weight:600;max-width:fit-content;}
  .linkage-pill b{color:var(--ink-soft);font-weight:800;}
  .divider-wrap{display:flex;align-items:center;gap:30px;}
  .divider-sub{font-size:15px;color:var(--ink-soft);line-height:1.7;max-width:44ch;border-left:3px solid var(--accent);padding-left:16px;}

  /* generic cards / steps */
  .card-grid{display:grid;gap:14px;flex:1;min-height:0;align-content:center;}
  .cols-2{grid-template-columns:1fr 1fr;} .cols-3{grid-template-columns:repeat(3,1fr);} .cols-4{grid-template-columns:repeat(4,1fr);}
  .card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:13px;padding:15px 17px;display:flex;flex-direction:column;gap:6px;}
  .card .num{font-family:"Black Han Sans",sans-serif;font-size:18px;color:var(--accent);}
  .card h3{font-size:14.5px;font-weight:800;color:var(--ink);}
  .card p{font-size:12.8px;line-height:1.58;color:var(--ink-soft);}

  .pipeline{display:flex;align-items:center;gap:0;flex:1;min-height:0;}
  .pipe-step{flex:1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:13px;padding:14px 12px;display:flex;flex-direction:column;gap:5px;}
  .pipe-step .pn{font-family:"Black Han Sans",sans-serif;font-size:19px;color:var(--accent);}
  .pipe-step h3{font-size:13px;font-weight:800;} .pipe-step p{font-size:11.2px;color:var(--ink-soft);line-height:1.48;}
  .pipe-arrow{flex:none;width:22px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:16px;}

  .table-wrap{overflow-x:auto;flex:1;}
  table.modeling{width:100%;border-collapse:collapse;font-size:13px;}
  table.modeling th,table.modeling td{border:1px solid var(--border);padding:9px 11px;text-align:left;vertical-align:top;}
  table.modeling thead th{background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;}
  table.modeling td{color:var(--ink-soft);line-height:1.5;}
  table.modeling td.strong{color:var(--ink);font-weight:700;}
  code.inline{font-family:"JetBrains Mono",monospace;background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12px;color:var(--ink);}

  .code-block{flex:1;background:var(--code-bg);border-radius:13px;padding:16px 18px;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.62;color:var(--code-ink);box-shadow:var(--shadow-sm);}
  .code-block .ln{color:var(--code-faint);display:inline-block;width:20px;text-align:right;margin-right:12px;user-select:none;}
  .kw{color:var(--code-kw);} .str{color:var(--code-str);} .num{color:var(--code-num);} .cm{color:var(--code-cm);}
  .code-note-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .code-note{font-size:11.8px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-radius:9px;padding:7px 11px;border:1px solid var(--border-soft);}
  .code-note b{color:var(--accent);}

  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0;align-content:center;}
  .compare-card{border-radius:15px;padding:17px 19px;display:flex;flex-direction:column;gap:10px;border:1px solid transparent;}
  .compare-card.good{background:var(--teal-soft);border-color:color-mix(in srgb, var(--teal) 30%, transparent);}
  .compare-card.bad{background:var(--danger-soft);border-color:color-mix(in srgb, var(--danger) 30%, transparent);}
  .compare-head{display:flex;align-items:center;gap:7px;font-weight:900;font-size:13.5px;}
  .compare-card.good .compare-head{color:var(--teal);} .compare-card.bad .compare-head{color:var(--danger);}
  .compare-caption{font-size:12px;color:var(--ink-soft);line-height:1.55;}
  .insight-strip{display:flex;gap:9px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:10px 15px;font-size:12.6px;font-weight:700;}

  .reading-card{flex:1;background:var(--surface-2);border-radius:15px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center;border:1px solid var(--border-soft);}
  .reading-card .lead{max-width:none;font-size:13.8px;}

  /* ===== interactive: stepper ===== */
  .stepper-wrap{display:flex;gap:22px;flex:1;min-height:0;}
  .stepper-list{flex:1;display:flex;flex-direction:column;gap:5px;justify-content:center;}
  .step-row{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:9px;transition:background .2s;font-size:12.6px;color:var(--ink-faint);font-weight:600;}
  .step-row .sdot{flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--ink-faint);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;}
  .step-row.done{color:var(--ink-soft);}
  .step-row.done .sdot{background:var(--teal-soft);color:var(--teal);}
  .step-row.current{background:var(--accent-soft);color:var(--ink);font-weight:800;font-size:13.4px;}
  .step-row.current .sdot{background:var(--accent);color:var(--accent-ink);}
  .stepper-side{width:270px;flex:none;display:flex;flex-direction:column;gap:14px;justify-content:center;}
  .stepper-display{background:var(--surface-2);border-radius:14px;padding:20px;text-align:center;}
  .stepper-display .sd-label{font-size:11px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .stepper-display .sd-num{font-family:"Black Han Sans",sans-serif;font-size:34px;color:var(--accent);margin:4px 0;}
  .stepper-display .sd-text{font-size:13.5px;font-weight:800;color:var(--ink);}
  .ctrl-row{display:flex;gap:8px;}
  .sim-btn{flex:none;appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:12.6px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;}
  .ctrl-row .sim-btn{flex:1;}
  .sim-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .sim-btn:disabled{opacity:.4;cursor:not-allowed;}
  .sim-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .sim-btn.primary:hover{filter:brightness(1.08);}
  .progress-dots{display:flex;gap:5px;justify-content:center;}
  .progress-dots span{width:7px;height:7px;border-radius:50%;background:var(--surface-3);}
  .progress-dots span.on{background:var(--accent);}

  /* ===== interactive: vertical code-flow simulator ===== */
  .flowsim-wrap{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;flex:1;min-height:0;}
  .flow-vertical{display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:center;}
  .flow-node{width:200px;text-align:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:12.2px;font-weight:700;color:var(--ink-faint);transition:.25s;}
  .flow-node.start-end{border-radius:999px;}
  .flow-node.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;transform:scale(1.04);box-shadow:var(--shadow-sm);}
  .flow-chevron{color:var(--ink-faint);font-size:13px;line-height:1;}
  .flowsim-side{display:flex;flex-direction:column;gap:12px;min-height:0;}
  .io-row{display:flex;gap:10px;}
  .io-field{flex:1;display:flex;flex-direction:column;gap:4px;}
  .io-field label{font-size:11px;font-weight:800;color:var(--ink-faint);}
  .io-field input{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700;}
  .mini-code{background:var(--code-bg);border-radius:12px;padding:12px 14px;font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.7;color:var(--code-ink);flex:1;overflow:auto;min-height:0;}
  .mini-code .cline{display:block;padding:1px 6px;border-radius:5px;transition:background .2s;}
  .mini-code .cline.active{background:rgba(109,151,245,.28);}
  .result-chip{background:var(--teal-soft);color:var(--teal);border-radius:10px;padding:9px 13px;font-size:12.6px;font-weight:800;text-align:center;min-height:20px;}

  /* ===== interactive: fare simulator SVG ===== */
  .fare-wrap{display:grid;grid-template-columns:1.3fr .9fr;gap:20px;flex:1;min-height:0;}
  .fc-diamond{fill:var(--surface-2);stroke:var(--border);stroke-width:1.6;}
  .fc-rect{fill:var(--surface-2);stroke:var(--border);stroke-width:1.6;}
  .fc-leaf{fill:var(--surface-3);stroke:var(--border);stroke-width:1.6;}
  .fc-edge{stroke:var(--border);stroke-width:2;}
  .fc-txt{font-family:"Gothic A1",sans-serif;font-size:12.5px;font-weight:800;fill:var(--ink-soft);}
  .fc-elabel{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;fill:var(--ink-faint);}
  .fc-el.active .fc-diamond,.fc-el.active .fc-rect,.fc-el.active .fc-leaf{fill:var(--accent);stroke:var(--accent);}
  .fc-el.active .fc-txt{fill:var(--accent-ink);}
  .fc-el.active.leaf-free .fc-leaf{fill:var(--teal);stroke:var(--teal);}
  .edge.active{stroke:var(--accent);stroke-width:3;}
  .elabel.active{fill:var(--accent);}
  .fare-side{display:flex;flex-direction:column;gap:12px;justify-content:center;}
  .fare-inputs{display:flex;gap:10px;}
  .fare-result{background:var(--surface-2);border-radius:14px;padding:18px;text-align:center;}
  .fare-result .fr-label{font-size:11px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;}
  .fare-result .fr-num{font-family:"Black Han Sans",sans-serif;font-size:30px;color:var(--accent);margin:4px 0;}
  .fare-result .fr-text{font-size:12px;color:var(--ink-soft);line-height:1.5;}

  /* ===== interactive: loop tracer ===== */
  .loop-wrap{display:grid;grid-template-columns:.85fr 1.15fr;gap:20px;flex:1;min-height:0;}
  .loop-vars{display:flex;gap:12px;}
  .loop-var{flex:1;background:var(--surface-2);border-radius:13px;padding:14px;text-align:center;}
  .loop-var .lv-label{font-size:11px;font-weight:800;color:var(--ink-faint);}
  .loop-var .lv-num{font-family:"Black Han Sans",sans-serif;font-size:28px;color:var(--accent);margin-top:2px;}
  .loop-cond{background:var(--surface-2);border-radius:12px;padding:11px 14px;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;text-align:center;color:var(--ink-soft);}
  .loop-cond .yes{color:var(--teal);font-weight:800;} .loop-cond .no{color:var(--danger);font-weight:800;}
  .loop-log{background:var(--surface-2);border-radius:12px;padding:10px 14px;overflow-y:auto;flex:1;min-height:0;}
  .loop-log table{width:100%;border-collapse:collapse;font-family:"JetBrains Mono",monospace;font-size:12px;}
  .loop-log th{text-align:left;color:var(--ink-faint);font-weight:800;padding:4px 6px;position:sticky;top:0;background:var(--surface-2);}
  .loop-log td{padding:4px 6px;color:var(--ink-soft);border-top:1px solid var(--border-soft);}
  .loop-log tr:last-child td{color:var(--accent);font-weight:800;}
  .loop-progress{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
  .loop-progress-fill{height:100%;background:var(--accent);transition:width .3s;}
  .loop-final{background:var(--teal-soft);color:var(--teal);border-radius:10px;padding:9px 13px;font-size:12.6px;font-weight:800;text-align:center;}

  /* ===== interactive: tabs ===== */
  .tab-bar{display:flex;gap:8px;margin-bottom:10px;}
  .tab-btn{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);font-weight:800;font-size:12.5px;padding:8px 16px;border-radius:9px;cursor:pointer;}
  .tab-btn.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .tab-panel{display:none;flex:1;min-height:0;}
  .tab-panel.active{display:flex;}

  /* ===== interactive: flip cards ===== */
  .flip-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;align-content:center;}
  .flip-card{perspective:1000px;height:150px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .flip-front{background:var(--surface-2);border:1px solid var(--border-soft);}
  .flip-back{background:var(--accent-soft);transform:rotateY(180deg);}
  .flip-front h3{font-size:15px;font-weight:900;color:var(--ink);}
  .flip-front p{font-size:11.6px;color:var(--ink-faint);}
  .flip-back p{font-size:12.4px;color:var(--ink);line-height:1.55;font-weight:600;}
  .flip-hint{font-size:10.5px;color:var(--ink-faint);font-weight:700;}

  /* ===== interactive: accordion ===== */
  .accordion{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;justify-content:center;}
  .acc-item{background:var(--surface-2);border-radius:12px;overflow:hidden;border:1px solid var(--border-soft);}
  .acc-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none;}
  .acc-head .an{font-family:"Black Han Sans",sans-serif;font-size:16px;color:var(--accent);flex:none;width:26px;}
  .acc-head h3{font-size:13.6px;font-weight:800;flex:1;}
  .acc-chevron{color:var(--ink-faint);transition:transform .25s;font-size:12px;}
  .acc-item.open .acc-chevron{transform:rotate(180deg);}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .acc-item.open .acc-body{max-height:120px;}
  .acc-body p{padding:0 16px 14px 54px;font-size:12.4px;color:var(--ink-soft);line-height:1.6;}

  /* ===== interactive: quiz ===== */
  .quiz-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;justify-content:center;}
  .quiz-top{display:flex;justify-content:space-between;align-items:center;}
  .quiz-progress-text{font-size:12px;font-weight:800;color:var(--ink-faint);}
  .quiz-score{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;}
  .quiz-scenario{background:var(--surface-2);border-radius:14px;padding:20px 22px;font-size:15px;font-weight:700;color:var(--ink);line-height:1.6;min-height:70px;display:flex;align-items:center;}
  .quiz-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .quiz-choice{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:13.5px;padding:14px 10px;border-radius:12px;cursor:pointer;transition:.15s;}
  .quiz-choice:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .quiz-choice:disabled{cursor:default;}
  .quiz-choice.correct{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .quiz-choice.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .quiz-feedback{font-size:12.8px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:11px 15px;line-height:1.55;min-height:20px;}
  .quiz-feedback.hidden{visibility:hidden;}
  .quiz-foot{display:flex;justify-content:flex-end;}
  .quiz-summary{display:none;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .quiz-summary.active{display:flex;}
  .quiz-summary .qs-num{font-family:"Black Han Sans",sans-serif;font-size:52px;color:var(--accent);}

  /* control bar */
  #controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:9px 12px;box-shadow:var(--shadow);z-index:50;}
  .ctl-btn{appearance:none;border:none;background:var(--surface-2);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .ctl-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .ctl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .ctl-btn.wide{width:auto;padding:0 14px;font-size:12.5px;font-weight:800;gap:6px;}
  .chip-counter{position:relative;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12.6px;color:var(--ink);background:var(--surface-2);border-radius:9px;padding:9px 14px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums;}
  .chip-counter::before,.chip-counter::after{content:"";position:absolute;left:14px;right:14px;height:2px;background:var(--border);}
  .chip-counter::before{top:-4px;} .chip-counter::after{bottom:-4px;}
  .progress-rail{position:fixed;left:0;right:0;bottom:0;height:3px;background:var(--border-soft);z-index:49;}
  .progress-fill{height:100%;background:var(--accent);transition:width .3s ease;}

  #toc-overlay{position:fixed;inset:0;background:rgba(10,16,28,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
  #toc-overlay.open{display:flex;}
  #toc-panel{width:min(560px,92vw);max-height:80vh;overflow-y:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px 8px 22px 22px;}
  #toc-panel h3{font-size:14px;font-weight:900;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;padding-right:14px;margin-bottom:12px;}
  .toc-list{list-style:none;margin:0;padding:0 14px 0 0;display:flex;flex-direction:column;gap:2px;}
  .toc-list button{width:100%;text-align:left;background:none;border:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--ink-soft);font-family:inherit;font-size:13.5px;font-weight:600;}
  .toc-list button:hover{background:var(--surface-2);}
  .toc-list button.current{background:var(--accent-soft);color:var(--accent);font-weight:800;}
  .toc-list .idx{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-faint);flex:none;width:22px;}
  .toc-list .divider-row button{color:var(--accent);font-weight:900;}
  .interactive-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);padding:4px 10px;border-radius:999px;margin-left:8px;letter-spacing:.02em;}

  @media (max-width:760px){
    .cols-2,.cols-3,.cols-4,.stepper-wrap,.flowsim-wrap,.fare-wrap,.loop-wrap,.compare-grid,.flip-grid,.quiz-choices{grid-template-columns:1fr!important;}
    .stepper-wrap,.flowsim-wrap,.fare-wrap,.loop-wrap{display:flex;flex-direction:column;}
    .slide{aspect-ratio:auto;min-height:78vh;}
    .slide-inner{padding:24px 20px 18px;} .topbar{padding:13px 20px 0;}
    .pipeline{flex-direction:column;} .pipe-arrow{transform:rotate(90deg);}
  }
  @media print{
    body{padding:0;background:#fff;}
    #controls,.progress-rail,#toc-overlay{display:none!important;}
    .slide{display:flex!important;aspect-ratio:auto;height:100vh;box-shadow:none;border-radius:0;page-break-after:always;margin:0 auto;}
  }
  :root{
    --bg:#e9eef6; --bg-grid:#d7e0ef;
    --surface:#ffffff; --surface-2:#eef2f9; --surface-3:#e4eaf4;
    --ink:#0e1626; --ink-soft:#48536b; --ink-faint:#8592ab;
    --accent:#2456d6; --accent-ink:#ffffff; --accent-soft:#dde6fc;
    --teal:#0ea89a; --teal-soft:#d9f2ee;
    --amber:#c97418; --amber-soft:#faead2;
    --danger:#c23c50; --danger-soft:#fbe2e6;
    --violet:#7451d6; --violet-soft:#e7e0fb;
    --border:rgba(14,22,38,.12); --border-soft:rgba(14,22,38,.07);
    --code-bg:#0c1730; --code-ink:#dbe6fb; --code-faint:#7489b3;
    --code-kw:#7fb0ff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
    --shadow: 0 24px 55px -28px rgba(14,22,38,.4);
    --shadow-sm: 0 8px 20px -12px rgba(14,22,38,.3);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a1120; --bg-grid:#0f1a30;
      --surface:#121b30; --surface-2:#182440; --surface-3:#1c2c4d;
      --ink:#edf1fb; --ink-soft:#aeb9d4; --ink-faint:#77839f;
      --accent:#6d97f5; --accent-ink:#081026; --accent-soft:#1c2c50;
      --teal:#3fd2c0; --teal-soft:#123832;
      --amber:#f0ab5c; --amber-soft:#3a2a12;
      --danger:#ea8090; --danger-soft:#3a1620;
      --violet:#a58aef; --violet-soft:#2a2350;
      --border:rgba(237,241,251,.14); --border-soft:rgba(237,241,251,.08);
      --code-bg:#060c1a; --code-ink:#dbe6fb; --code-faint:#6d80a8;
      --code-kw:#8fbaff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
      --shadow: 0 24px 55px -28px rgba(0,0,0,.65);
      --shadow-sm: 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1120; --bg-grid:#0f1a30;
    --surface:#121b30; --surface-2:#182440; --surface-3:#1c2c4d;
    --ink:#edf1fb; --ink-soft:#aeb9d4; --ink-faint:#77839f;
    --accent:#6d97f5; --accent-ink:#081026; --accent-soft:#1c2c50;
    --teal:#3fd2c0; --teal-soft:#123832;
    --amber:#f0ab5c; --amber-soft:#3a2a12;
    --danger:#ea8090; --danger-soft:#3a1620;
    --violet:#a58aef; --violet-soft:#2a2350;
    --border:rgba(237,241,251,.14); --border-soft:rgba(237,241,251,.08);
    --code-bg:#060c1a; --code-ink:#dbe6fb; --code-faint:#6d80a8;
    --code-kw:#8fbaff; --code-str:#7fe0c9; --code-num:#f0b46b; --code-cm:#5e7099;
    --shadow: 0 24px 55px -28px rgba(0,0,0,.65);
    --shadow-sm: 0 8px 20px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color:var(--ink);
    font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:28px 16px 118px;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  h1,h2,h3,p{margin:0;}
  button,input,textarea{font-family:inherit;}

  #deck-stage{width:100%;max-width:1180px;display:flex;justify-content:center;}
  .slide{
    display:none;width:100%;aspect-ratio:16/9;background:var(--surface);
    border:1px solid var(--border-soft);border-radius:22px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;flex-direction:column;
  }
  .slide.active{display:flex;animation:rise .38s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.slide.active{animation:none;}}

  .slide-inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 52px 24px;overflow-y:auto;min-height:0;}
  .slide-inner::-webkit-scrollbar{width:8px;}
  .slide-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 52px 0;flex:none;}
  .breadcrumb{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
  .breadcrumb .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-faint);}
  .kind-tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;text-transform:uppercase;}

  .kicker{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;display:block;}
  .h1{font-weight:900;font-size:clamp(21px,2.3vw,30px);line-height:1.25;text-wrap:balance;color:var(--ink);margin-bottom:12px;}
  .lead{font-size:16px;line-height:1.68;color:var(--ink-soft);max-width:68ch;}
  .lead b{color:var(--ink);font-weight:800;}

  .slide[data-kind="title"] .slide-inner,.slide[data-kind="divider"] .slide-inner{justify-content:center;padding:34px 64px;position:relative;}
  .chip-icon{position:absolute;top:30px;right:40px;width:70px;height:70px;opacity:.5;}
  .big-num{font-family:"Black Han Sans",sans-serif;font-size:clamp(58px,9vw,116px);line-height:.85;color:var(--accent);}
  .title-block .h1{font-size:clamp(27px,3.4vw,40px);margin:6px 0 15px;}
  .subject-eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .goal-list{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:60ch;}
  .goal-item{display:flex;gap:11px;align-items:flex-start;font-size:15.2px;color:var(--ink-soft);line-height:1.6;}
  .goal-item .mark{flex:none;width:21px;height:21px;border-radius:7px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-top:1px;}
  .linkage-pill{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:11.6px;color:var(--ink-faint);border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-weight:600;max-width:fit-content;}
  .linkage-pill b{color:var(--ink-soft);font-weight:800;}
  .interactive-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);padding:4px 10px;border-radius:999px;margin-top:12px;letter-spacing:.02em;}
  .divider-wrap{display:flex;align-items:center;gap:30px;}
  .divider-sub{font-size:15.8px;color:var(--ink-soft);line-height:1.7;max-width:44ch;border-left:3px solid var(--accent);padding-left:16px;}

  .card-grid{display:grid;gap:13px;flex:1;min-height:0;align-content:center;}
  .cols-2{grid-template-columns:1fr 1fr;} .cols-3{grid-template-columns:repeat(3,1fr);} .cols-4{grid-template-columns:repeat(4,1fr);}
  .card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:13px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
  .card .num{font-family:"Black Han Sans",sans-serif;font-size:18px;color:var(--accent);}
  .card h3{font-size:14.6px;font-weight:800;color:var(--ink);}
  .card p{font-size:13.6px;line-height:1.56;color:var(--ink-soft);}

  .pipeline{display:flex;align-items:center;gap:0;flex:1;min-height:0;}
  .pipe-step{flex:1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:13px;padding:13px 11px;display:flex;flex-direction:column;gap:5px;}
  .pipe-step .pn{font-family:"Black Han Sans",sans-serif;font-size:18px;color:var(--accent);}
  .pipe-step h3{font-size:13.4px;font-weight:800;} .pipe-step p{font-size:12.2px;color:var(--ink-soft);line-height:1.45;}
  .pipe-arrow{flex:none;width:20px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:15px;}

  .table-wrap{overflow-x:auto;flex:1;}
  table.modeling{width:100%;border-collapse:collapse;font-size:13.8px;}
  table.modeling th,table.modeling td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;}
  table.modeling thead th{background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.4px;}
  table.modeling td{color:var(--ink-soft);line-height:1.5;}
  table.modeling td.strong{color:var(--ink);font-weight:700;}
  code.inline{font-family:"JetBrains Mono",monospace;background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:11.6px;color:var(--ink);}

  .code-block{flex:1;background:var(--code-bg);border-radius:13px;padding:15px 17px;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:12.8px;line-height:1.62;color:var(--code-ink);box-shadow:var(--shadow-sm);}
  .code-block .ln{color:var(--code-faint);display:inline-block;width:18px;text-align:right;margin-right:12px;user-select:none;}
  .kw{color:var(--code-kw);} .str{color:var(--code-str);} .num{color:var(--code-num);} .cm{color:var(--code-cm);}
  .cline{display:block;padding:1px 6px;border-radius:5px;transition:background .2s;}
  .cline.active{background:rgba(109,151,245,.28);}

  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;align-content:center;}
  .compare-card{border-radius:15px;padding:16px 18px;display:flex;flex-direction:column;gap:9px;border:1px solid transparent;}
  .compare-card.good{background:var(--teal-soft);border-color:color-mix(in srgb, var(--teal) 30%, transparent);}
  .compare-card.bad{background:var(--danger-soft);border-color:color-mix(in srgb, var(--danger) 30%, transparent);}
  .compare-head{display:flex;align-items:center;gap:7px;font-weight:900;font-size:13px;}
  .compare-card.good .compare-head{color:var(--teal);} .compare-card.bad .compare-head{color:var(--danger);}
  .compare-caption{font-size:13px;color:var(--ink-soft);line-height:1.55;}
  .trait-list{display:flex;flex-wrap:wrap;gap:7px;}
  .trait{font-size:11.6px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);}
  .insight-strip{display:flex;gap:9px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:10px 15px;font-size:13.4px;font-weight:700;}
  .reading-card{flex:1;background:var(--surface-2);border-radius:15px;padding:20px 22px;display:flex;flex-direction:column;gap:11px;justify-content:center;border:1px solid var(--border-soft);}
  .reading-card .lead{max-width:none;font-size:14.6px;}
  .term-chip{font-size:11.8px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);padding:6px 11px;border-radius:999px;}
  .term-chip b{color:var(--accent);}
  .reading-tagrow{display:flex;gap:7px;flex-wrap:wrap;}

  /* ===== buttons ===== */
  .sim-btn{flex:none;appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:12.4px;padding:9px 16px;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .sim-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .sim-btn:disabled{opacity:.4;cursor:not-allowed;}
  .sim-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .sim-btn.primary:hover{filter:brightness(1.08);}
  .ctrl-row{display:flex;gap:8px;}
  .ctrl-row .sim-btn{flex:1;}

  /* ===== generic chip ===== */
  .chip{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink-soft);font-weight:700;font-size:13.8px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  /* ===== interactive: 엘리베이터 생각열기 ===== */
  .elev-row{display:flex;gap:14px;justify-content:center;margin:10px 0 4px;flex:none;}
  .elev-card{flex:1;max-width:160px;background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:14px;padding:16px 12px;text-align:center;transition:.2s;}
  .elev-card .ec-id{font-family:"Black Han Sans",sans-serif;font-size:22px;color:var(--accent);}
  .elev-card .ec-floor{font-size:13px;color:var(--ink-soft);margin-top:4px;font-weight:700;}
  .elev-card.winner{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 2px var(--teal) inset;}
  .elev-card .ec-dist{font-size:11.4px;color:var(--ink-faint);margin-top:6px;font-weight:700;min-height:16px;}
  .elev-target-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex:none;flex-wrap:wrap;}
  .elev-target-btn{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:13.6px;padding:10px 18px;border-radius:11px;cursor:pointer;transition:.15s;}
  .elev-target-btn:hover{border-color:var(--accent);color:var(--accent);}
  .elev-target-btn.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}

  /* ===== interactive: 성장 비교 바 ===== */
  .growth-wrap{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;justify-content:center;}
  .growth-slider-row{display:flex;align-items:center;gap:14px;}
  .growth-slider-row input[type=range]{flex:1;accent-color:var(--accent);}
  .growth-n-badge{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13.6px;color:var(--accent);background:var(--accent-soft);padding:7px 13px;border-radius:9px;min-width:74px;text-align:center;}
  .bar-row{display:flex;flex-direction:column;gap:6px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:13.6px;font-weight:800;color:var(--ink);}
  .bar-row .bar-label span:last-child{font-family:"JetBrains Mono",monospace;color:var(--ink-soft);font-weight:700;}
  .bar-track{height:24px;background:var(--surface-2);border-radius:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;transition:width .35s ease;min-width:3px;}
  .case-bar{display:flex;gap:8px;flex:none;}
  .case-btn{flex:1;appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);font-weight:800;font-size:12.6px;padding:8px 12px;border-radius:9px;cursor:pointer;}
  .case-btn.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .case-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:12px;align-items:stretch;}
  .case-note{font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .case-explain{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-width:0;}
  .case-explain .ce-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .case-explain .ce-name{font-size:16px;font-weight:900;color:var(--accent);}
  .case-explain .ce-def{font-size:13.2px;color:var(--ink-soft);font-weight:700;}
  .case-explain .ce-item{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:9px 11px;}
  .case-explain .ce-item h4{margin:0;font-size:13px;font-weight:800;color:var(--ink);display:flex;justify-content:space-between;gap:8px;}
  .case-explain .ce-item h4 span{font-family:"JetBrains Mono",monospace;font-size:12.4px;}
  .case-explain .ce-item p{margin:0;font-size:12.6px;line-height:1.55;color:var(--ink-soft);}
  .case-explain code{font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink);}
  .case-explain .ins h4 span{color:var(--amber);} .case-explain .qk h4 span{color:var(--teal);}
  @media (max-width:760px){.case-layout{grid-template-columns:1fr;}}

  /* ===== interactive: flip-cards (용어) ===== */
  .flip-card{perspective:1000px;height:130px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .flip-front{background:var(--surface-2);border:1px solid var(--border-soft);}
  .flip-back{background:var(--accent-soft);transform:rotateY(180deg);}
  .flip-front h3{font-size:15.2px;font-weight:900;color:var(--ink);}
  .flip-front p{font-size:12px;color:var(--ink-faint);}
  .flip-back p{font-size:12.8px;color:var(--ink);line-height:1.5;font-weight:600;}

  /* ===== interactive: accordion ===== */
  .accordion{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;justify-content:center;}
  .acc-item{background:var(--surface-2);border-radius:12px;overflow:hidden;border:1px solid var(--border-soft);}
  .acc-head{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer;user-select:none;}
  .acc-head .an{font-family:"JetBrains Mono",monospace;font-size:13.5px;font-weight:800;color:var(--accent);flex:none;width:92px;white-space:nowrap;}
  .acc-head h3{font-size:13.6px;font-weight:800;flex:1;}
  .acc-chevron{color:var(--ink-faint);transition:transform .25s;font-size:12px;}
  .acc-item.open .acc-chevron{transform:rotate(180deg);}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .acc-item.open .acc-body{max-height:150px;}
  .acc-body p{padding:0 15px 13px 119px;font-size:13px;color:var(--ink-soft);line-height:1.55;}

  /* ===== interactive: quiz ===== */
  .quiz-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:13px;justify-content:center;}
  .quiz-active{display:flex;flex-direction:column;gap:13px;flex:1;min-height:0;justify-content:center;}
  .quiz-top{display:flex;justify-content:space-between;align-items:center;}
  .quiz-progress-text{font-size:12px;font-weight:800;color:var(--ink-faint);}
  .quiz-score{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:12.6px;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;}
  .quiz-scenario{background:var(--surface-2);border-radius:14px;padding:18px 20px;font-size:15.8px;font-weight:700;color:var(--ink);line-height:1.55;min-height:58px;display:flex;align-items:center;}
  .quiz-choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .quiz-choice{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-weight:700;font-size:13.8px;padding:11px 12px;border-radius:11px;cursor:pointer;transition:.15s;text-align:left;}
  .quiz-choice:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .quiz-choice:disabled{cursor:default;}
  .quiz-choice.correct{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .quiz-choice.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .quiz-feedback{font-size:13.6px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:10px 14px;line-height:1.5;min-height:18px;}
  .quiz-feedback.hidden{visibility:hidden;}
  .quiz-foot{display:flex;justify-content:flex-end;}
  .quiz-summary{display:none;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .quiz-summary.active{display:flex;}
  .quiz-summary .qs-num{font-family:"Black Han Sans",sans-serif;font-size:50px;color:var(--accent);}

  /* ===== interactive: tabs ===== */
  .tab-bar{display:flex;gap:8px;margin-bottom:10px;}
  .tab-btn{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);font-weight:800;font-size:12.2px;padding:8px 15px;border-radius:9px;cursor:pointer;}
  .tab-btn.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .tab-panel{display:none;flex:1;min-height:0;}
  .tab-panel.active{display:flex;}

  /* ===== interactive: 다리 건너기 (개별 활동) ===== */
  .bridge-wrap{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;}
  .bridge-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
  .bridge-side{background:var(--surface-2);border-radius:14px;padding:13px;min-height:96px;}
  .bridge-side-label{font-size:11px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;margin-bottom:8px;}
  .bridge-people{display:flex;flex-wrap:wrap;gap:7px;}
  .person-chip{appearance:none;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-weight:800;font-size:12.6px;padding:7px 11px;border-radius:10px;cursor:pointer;transition:.15s;font-family:"JetBrains Mono",monospace;}
  .person-chip:hover{border-color:var(--accent);}
  .person-chip.picked{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .person-chip.disabled{opacity:.35;cursor:default;pointer-events:none;}
  .bridge-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink-soft);text-align:center;width:78px;}
  .bridge-mid .lantern{font-size:24px;}
  .bridge-action-row{display:flex;gap:8px;align-items:center;justify-content:center;flex:none;}
  .bridge-time{font-family:"JetBrains Mono",monospace;font-weight:800;color:var(--accent);font-size:13.6px;background:var(--accent-soft);padding:7px 14px;border-radius:9px;}
  .trip-log{max-height:64px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;flex:none;}
  .trip-row{font-size:11.8px;color:var(--ink-soft);background:var(--surface-2);border-radius:7px;padding:5px 10px;display:flex;justify-content:space-between;font-weight:600;}
  .bridge-done{display:none;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--teal-soft);border-radius:13px;padding:14px;flex:none;}
  .bridge-done.warn{background:var(--amber-soft);}

  #controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:9px 12px;box-shadow:var(--shadow);z-index:50;}
  .ctl-btn{appearance:none;border:none;background:var(--surface-2);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .ctl-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .ctl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .ctl-btn.wide{width:auto;padding:0 14px;font-size:12.5px;font-weight:800;gap:6px;}
  .chip-counter{position:relative;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12.6px;color:var(--ink);background:var(--surface-2);border-radius:9px;padding:9px 14px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums;}
  .chip-counter::before,.chip-counter::after{content:"";position:absolute;left:14px;right:14px;height:2px;background:var(--border);}
  .chip-counter::before{top:-4px;} .chip-counter::after{bottom:-4px;}
  .progress-rail{position:fixed;left:0;right:0;bottom:0;height:3px;background:var(--border-soft);z-index:49;}
  .progress-fill{height:100%;background:var(--accent);transition:width .3s ease;}

  #toc-overlay{position:fixed;inset:0;background:rgba(10,16,28,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
  #toc-overlay.open{display:flex;}
  #toc-panel{width:min(560px,92vw);max-height:80vh;overflow-y:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px 8px 22px 22px;}
  #toc-panel h3{font-size:14px;font-weight:900;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;padding-right:14px;margin-bottom:12px;}
  .toc-list{list-style:none;margin:0;padding:0 14px 0 0;display:flex;flex-direction:column;gap:2px;}
  .toc-list button{width:100%;text-align:left;background:none;border:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--ink-soft);font-family:inherit;font-size:13.5px;font-weight:600;}
  .toc-list button:hover{background:var(--surface-2);}
  .toc-list button.current{background:var(--accent-soft);color:var(--accent);font-weight:800;}
  .toc-list .idx{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-faint);flex:none;width:22px;}
  .toc-list .divider-row button{color:var(--accent);font-weight:900;}

  @media (max-width:760px){
    .cols-2,.cols-3,.cols-4,.compare-grid,.bridge-sides,.quiz-choices{grid-template-columns:1fr!important;}
    .slide{aspect-ratio:auto;min-height:78vh;}
    .slide-inner{padding:22px 18px 16px;} .topbar{padding:12px 18px 0;}
    .pipeline{flex-direction:column;} .pipe-arrow{transform:rotate(90deg);}
  }
  @media print{
    body{padding:0;background:#fff;}
    #controls,.progress-rail,#toc-overlay{display:none!important;}
    .slide{display:flex!important;aspect-ratio:auto;height:100vh;box-shadow:none;border-radius:0;page-break-after:always;margin:0 auto;}
  }

  /* ===== hub (landing) screen ===== */
  #hub{width:100%;max-width:1180px;}
  .hub-card-outer{background:var(--surface);border:1px solid var(--border-soft);border-radius:22px;box-shadow:var(--shadow);padding:44px 52px 48px;}
  .hub-eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:10px;}
  .hub-title{font-weight:900;font-size:clamp(24px,3vw,34px);line-height:1.25;color:var(--ink);margin-bottom:12px;}
  .hub-sub{font-size:15.4px;line-height:1.68;color:var(--ink-soft);max-width:70ch;margin-bottom:30px;}
  .hub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .hub-unit{appearance:none;text-align:left;cursor:pointer;border:1.5px solid var(--border-soft);background:var(--surface-2);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px;transition:.18s;font-family:inherit;color:inherit;}
  .hub-unit:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-3px);box-shadow:var(--shadow-sm);}
  .hub-unit .hu-top{display:flex;align-items:center;justify-content:space-between;}
  .hub-unit .hu-num{font-family:"Black Han Sans",sans-serif;font-size:34px;color:var(--accent);line-height:1;}
  .hub-unit .hu-badge{font-size:10.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);padding:4px 9px;border-radius:999px;letter-spacing:.02em;}
  .hub-unit h2{font-size:17px;font-weight:900;color:var(--ink);margin:2px 0 2px;}
  .hub-unit p{font-size:12.8px;line-height:1.55;color:var(--ink-soft);flex:1;}
  .hub-unit .hu-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.6px;font-weight:700;color:var(--ink-faint);margin-top:4px;}
  .hub-unit .hu-open{color:var(--accent);font-weight:800;display:inline-flex;align-items:center;gap:4px;}
  .hub-footnote{margin-top:26px;font-size:12px;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
  #deck-stage{display:none;}
  #deck-stage.active{display:flex;}
  @media (max-width:760px){
    .hub-grid{grid-template-columns:1fr!important;}
    .hub-card-outer{padding:28px 22px 30px;}
  }

  /* ===== interactive: 카드 정렬 게임 (생각 열기) ===== */
  .sortgame-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
  .sortgame-card{width:58px;height:58px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:19px;color:var(--ink);cursor:pointer;transition:.15s;}
  .sortgame-card:hover:not(.picked){border-color:var(--accent);color:var(--accent);}
  .sortgame-card.picked{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);opacity:.55;cursor:default;}
  .sortgame-card.wrong{animation:sgshake .35s;border-color:var(--danger);}
  @keyframes sgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .sortgame-track{display:flex;gap:8px;justify-content:center;min-height:34px;margin-top:4px;flex-wrap:wrap;}
  .sortgame-slot{width:40px;height:30px;border-radius:8px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;color:var(--teal);}

  /* ===== array bar visualization (정렬/탐색 스테퍼 공용) ===== */
  .array-wrap{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;justify-content:center;}
  .array-row{display:flex;align-items:flex-end;gap:6px;height:160px;justify-content:center;}
  .array-bar{width:42px;border-radius:8px 8px 4px 4px;background:var(--surface-3);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;color:var(--ink-soft);transition:background .2s,transform .2s;position:relative;}
  .array-bar.cur{background:var(--amber);color:#fff;transform:translateY(-4px);}
  .array-bar.cmp{background:var(--accent);color:#fff;}
  .array-bar.swap{background:var(--danger);color:#fff;transform:translateY(-4px);}
  .array-bar.sorted{background:var(--teal);color:#fff;}
  .array-idx{font-size:10.5px;color:var(--ink-faint);text-align:center;width:42px;font-family:"JetBrains Mono",monospace;}
  .array-idx-row{display:flex;gap:6px;justify-content:center;}
  .array-ptr-row{display:flex;gap:6px;justify-content:center;min-height:18px;}
  .array-ptr{width:42px;text-align:center;font-size:11px;font-weight:800;color:var(--ink-faint);}
  .array-ptr.on{color:var(--accent);}
  .stepper-log{background:var(--surface-2);border-radius:11px;padding:11px 15px;font-size:13.2px;color:var(--ink);font-weight:700;min-height:20px;text-align:center;}
  .stepper-meta{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--ink-faint);font-weight:700;}
  .stepper-meta b{color:var(--accent);font-family:"JetBrains Mono",monospace;}

  /* ===== 직접 정렬해보기 (개별 활동) ===== */
  .manual-wrap{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;justify-content:center;}
  .manual-hint{font-size:12.6px;color:var(--ink-faint);text-align:center;}
  .manual-done-msg{display:none;background:var(--teal-soft);border-radius:12px;padding:12px;text-align:center;font-weight:800;color:var(--teal);font-size:13.6px;}
  .manual-done-msg.show{display:block;}


  /* ===== array bar visualization (탐색 스테퍼 공용) ===== */
  .array-wrap{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;justify-content:center;}
  .array-row{display:flex;align-items:flex-end;gap:6px;height:160px;justify-content:center;}
  .array-bar{width:42px;border-radius:8px 8px 4px 4px;background:var(--surface-3);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;color:var(--ink-soft);transition:background .2s,transform .2s;position:relative;}
  .array-bar.cur{background:var(--amber);color:#fff;transform:translateY(-4px);}
  .array-bar.cmp{background:var(--accent);color:#fff;}
  .array-bar.swap{background:var(--danger);color:#fff;transform:translateY(-4px);}
  .array-bar.sorted{background:var(--teal);color:#fff;}
  .array-idx{font-size:10.5px;color:var(--ink-faint);text-align:center;width:42px;font-family:"JetBrains Mono",monospace;}
  .array-idx-row{display:flex;gap:6px;justify-content:center;}
  .array-ptr-row{display:flex;gap:6px;justify-content:center;min-height:18px;}
  .array-ptr{width:42px;text-align:center;font-size:11px;font-weight:800;color:var(--ink-faint);}
  .array-ptr.on{color:var(--accent);}
  .stepper-log{background:var(--surface-2);border-radius:11px;padding:11px 15px;font-size:13.2px;color:var(--ink);font-weight:700;min-height:20px;text-align:center;}
  .stepper-meta{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--ink-faint);font-weight:700;}
  .stepper-meta b{color:var(--accent);font-family:"JetBrains Mono",monospace;}

  /* ===== interactive: 이진 탐색 숫자 맞히기 (생각 열기) ===== */
  .guess-wrap{display:flex;flex-direction:column;gap:16px;align-items:center;margin-top:18px;}
  .guess-range{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:21px;color:var(--ink-faint);}
  .guess-range b{color:var(--accent);}
  .guess-input-row{display:flex;gap:12px;align-items:stretch;}
  .guess-input-row input[type="number"]::placeholder{font-size:18px;font-weight:700;color:var(--ink-faint);}
  .guess-input-row input[type="number"]{width:210px;font-family:"JetBrains Mono",monospace;font-size:28px;font-weight:800;text-align:center;border:2px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--surface);color:var(--ink);}
  .guess-feedback{font-size:20px;font-weight:800;min-height:30px;text-align:center;}
  .guess-feedback.up{color:var(--danger);} .guess-feedback.down{color:var(--accent);} .guess-feedback.win{color:var(--teal);}
  .guess-log{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:640px;}
  .guess-chip{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);}
  .guess-count{font-size:15.5px;color:var(--ink-faint);font-weight:700;}

  /* ===== array bar 탐색 modifiers (search-stepper 공용, array-* 재사용) ===== */
  .array-bar.target{outline:3px solid var(--accent);outline-offset:2px;}
  .array-bar.found{background:var(--teal);color:#fff;transform:translateY(-4px);}
  .array-bar.excluded{opacity:.32;}
  .search-target-row{display:flex;gap:8px;justify-content:center;align-items:center;font-size:12.6px;color:var(--ink-faint);font-weight:700;}

  /* ===== 해시 테이블 삽입 시뮬레이터 ===== */
  .hash-formula{text-align:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:15px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px;margin-bottom:2px;}
  .hash-table-wrap{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow-y:auto;}
  .hash-row{display:flex;align-items:center;gap:8px;}
  .hash-bucket-label{width:70px;flex:none;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:12.5px;color:var(--ink-faint);text-align:right;}
  .hash-chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:30px;flex:1;border-bottom:1px dashed var(--border-soft);padding-bottom:5px;}
  .hash-node{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:8px;padding:4px 10px;color:var(--ink);}
  .hash-node.new{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .hash-node.collide{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
  .hash-insert-row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .hash-cur-key{font-family:"JetBrains Mono",monospace;font-weight:900;font-size:20px;color:var(--ink);}

  /* ===== 해시 탐색: 버킷에 직접 넣어 보기 ===== */
  .hp-layout{display:grid;grid-template-columns:minmax(250px,.8fr) 1.2fr;gap:16px;flex:1;min-height:0;align-items:stretch;}
  .hp-side{display:flex;flex-direction:column;gap:8px;min-height:0;}
  .hp-steps{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:800;}
  .hp-step{padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--border-soft);}
  .hp-step.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .hp-step.done{background:var(--teal-soft);color:var(--teal);border-color:transparent;}
  .hp-arrow{color:var(--ink-faint);}
  .hp-pool-label{font-size:11.5px;font-weight:800;color:var(--ink-faint);}
  .hp-pool{display:flex;flex-wrap:wrap;gap:7px;min-height:38px;}
